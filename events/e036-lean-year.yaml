    - label: Thank him and wait
      effects: {}
scribe_hint: Tertius shows the liver to the farmers; nobody laughs.
historical_note: >-
  The bronze Liver of Piacenza divides the liver into regions, each belonging
  to a god; a haruspex read the gods' intentions from the shape of each part.
source: "The Liver of Piacenza (Museo Civico, Piacenza) - check before publishing"
