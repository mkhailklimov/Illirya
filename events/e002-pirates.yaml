id: e002-pirates
deck: sea
title: Sails off Risinium
category: raiders
seasons: [Spring, Summer, Autumn]
years: [30, 89]
trigger: random
chance: 0.10
once: false
effects: {}
choice:
  prompt: Pirate ships shelter in the coves near Risinium and prey on the bay's shipping.
  options:
    - label: Send soldiers along the shore to drive them out
      effects: {treasury: -200}                         # DRAFT: cost of the expedition
      roll:                                             # d20 + 1 per 50 soldiers; need 12
        die: 20
        bonus: army / 50 + home_defence
        target: 12
        success: {favour: 3, loyalty: 2}                # the coves are cleared
        failure: {army: -20, loyalty: -2}               # an ambush among the rocks
    - label: Pay them to sail elsewhere
      effects: {treasury: -400, favour: -3}             # DRAFT: Rome frowns on paying pirates
    - label: Do nothing and keep the ships in harbour
      effects: {cloth: -3, wine: -3, loyalty: -2}   # DRAFT: trade stops for a season
scribe_hint: Fishermen whisper of light, fast ships with no banner; the merchants refuse to sail.
historical_note: >-
  Illyrian sea-raiding was what first drew Rome across the Adriatic: piracy
  under Queen Teuta, whose stronghold tradition places at Rhizon (Risinium,
  today's Risan), led to the First Illyrian War in 229 BC.
source: "Polybius, Histories II.8–12; Wilkes, The Illyrians (1992) — check before publishing"
