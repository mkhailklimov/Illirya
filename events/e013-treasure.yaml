choice:
  prompt: >-
    A farmer above the bay has struck a jar full of old coins: bronze and
    silver of the Illyrian kings, buried long ago.
  options:
    - label: Claim it for the treasury
      effects: {treasury: 500, loyalty: -2}       # DRAFT
