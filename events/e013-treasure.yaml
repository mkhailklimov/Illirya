scribe_hint: The coins are green with age; one shows a king's head and a ship.
historical_note: >-
  King Gentius, the last Illyrian king, minted coins at Scodra and Lissus
  before Rome defeated him in 168 BC; such coins still turn up in hoards
  along this coast.
source: "Livy 44.30-32 on Gentius; numismatic finds - check before publishing"
