scribe_hint: The farmers gather round the strange machine and argue about the wheels.
historical_note: >-
  Pliny describes a new plough with two small wheels used in Raetia, north
  of the Alps. Iron shares made Roman ploughs far stronger than the old
  wooden ard.
source: "Pliny, Natural History 18.172 - check before publishing"
