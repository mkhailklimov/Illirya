<title>Illyria: The Governor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&family=Cormorant+Garamond:ital,wght@1,500&family=Marcellus&display=swap">
<style>
/* Layout: the table of a board game. The board (city sheet or Adriatic map, in tabs) beside the council;
   below it the season's stage: cards, then the order book, then the report. Compass and die sit in the corners. */
:root {
  color-scheme: dark;
  --night: #0f1430;      /* page ground */
  --dusk: #261b42;       /* panels */
  --wine: #2c0819;       /* inset wells */
  --gold: #e2bd66;       /* accent: lettering, rules, coins */
  --gold-pale: #f6e3a1;
  --ink: #f3e8d2;
  --mute: #b9a98f;
  --crimson: #b8324f;
  --sea-deep: #0b2440;
  --line: rgba(226, 189, 102, .35);
  --faint: rgba(226, 189, 102, .16);
  --good: #9fdcae; --bad: #ff9b9b;
  --land: #6d5a1e; --seacard: #11485a; --omen: #5a1640;
  --f-display: "Caesar Dressing", "Marcellus", Georgia, serif;
  --f-label: "Marcellus", Georgia, "Times New Roman", serif;
  --f-voice: "Cormorant Garamond", Georgia, serif;
  --gutter: clamp(16px, 3vw, 32px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: radial-gradient(1200px 700px at 30% -10%, #2a1d4a 0%, var(--night) 60%) fixed, var(--night);
  color: var(--ink); font: 17px/1.5 var(--f-label); padding: 0 var(--gutter); padding-block: 16px 120px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
:focus-visible { outline: 2px solid var(--gold-pale); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 16px; }
h2 { font: 400 clamp(23px, 2.8vw, 29px)/1.15 var(--f-display); color: var(--gold); margin: 0 0 8px; letter-spacing: .03em; text-wrap: balance; }
h3 { font: 400 17px/1.3 var(--f-label); color: var(--gold-pale); margin: 0; letter-spacing: .04em; }
.eyebrow { font-size: 12.5px; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); margin: 0 0 8px; }
.voice { font: italic 500 21px/1.4 var(--f-voice); color: var(--ink); max-width: 62ch; margin: 0; }
.sum { color: var(--mute); font-size: 15px; font-variant-numeric: tabular-nums; }
.panel { background: rgba(38, 27, 66, .72); border: 1px solid var(--line); border-radius: 16px; padding: 16px clamp(14px, 2.2vw, 22px); min-width: 0; }

/* header and tabs */
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 400 clamp(32px, 4.6vw, 46px)/1 var(--f-display); color: var(--gold); letter-spacing: .04em; }
.brand span { font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold-pale); }
.when { font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.when b { color: var(--gold-pale); font-weight: 400; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.ghost:hover { color: var(--gold-pale); border-color: var(--gold); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { background: none; border: 1px solid transparent; border-bottom: 0; border-radius: 12px 12px 0 0; padding: 8px 16px 7px; color: var(--mute); letter-spacing: .12em; text-transform: uppercase; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
.tab b { font: 400 19px var(--f-display); letter-spacing: .04em; text-transform: none; }
.tab[aria-selected="true"] { color: var(--gold-pale); border-color: var(--line); background: rgba(38, 27, 66, .9); margin-bottom: -1px; }

/* ledger */
.ledger { display: grid; grid-template-columns: repeat(auto-fit, minmax(122px, 1fr)); border: 1px solid var(--line); border-radius: 14px; background: rgba(38, 27, 66, .6); overflow: hidden; }
.num { padding: 9px 14px 10px; border-right: 1px solid var(--faint); display: grid; min-width: 0; }
.num .k { font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }
.num .v { font-size: 25px; color: var(--gold-pale); font-variant-numeric: tabular-nums; line-height: 1.2; }
.num .u { font-size: 12.5px; color: var(--mute); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.up { color: var(--good) !important; } .down { color: var(--bad) !important; }
.num.warn .v { color: var(--bad); }

/* board + council */
.table { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .table { grid-template-columns: minmax(0, 1fr); } }
.board { display: grid; min-width: 0; }
.sheet { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 16px 16px; background: rgba(38, 27, 66, .72); padding: 14px; display: grid; gap: 14px; min-width: 0; }
.mapwrap { overflow: hidden; border-radius: 12px; border: 1px solid var(--faint); background: var(--sea-deep); }
.mapwrap svg { display: block; width: 100%; height: auto; }
.plot-hit, .town-hit { cursor: pointer; }
.plot-hit:hover .plot-frame, .plot-hit:focus-visible .plot-frame { stroke: var(--gold-pale); stroke-width: 3; }
.plot-hit:focus, .town-hit:focus { outline: none; }
.town-hit:hover .dot, .town-hit:focus-visible .dot { stroke: var(--gold-pale); stroke-width: 4; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--mute); }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.stores { display: grid; gap: 10px; }
.stores-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.good { border: 1px solid var(--faint); border-radius: 10px; padding: 6px 10px; display: grid; min-width: 0; }
.good .n { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.good .q { font-size: 19px; color: var(--gold-pale); font-variant-numeric: tabular-nums; display: flex; gap: 6px; align-items: baseline; }
.good .q small { font-size: 12.5px; }
.good.zero .q { color: rgba(185,169,143,.55); }
.towninfo { display: grid; gap: 8px; }
.twocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.prices { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.prices td { padding: 4px 6px; border-top: 1px solid var(--faint); }
.prices td:nth-child(2) { text-align: right; }
.prices td:nth-child(3) { color: var(--mute); font-size: 13px; }

/* council */
.council { display: grid; gap: 10px; }
.adv { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 2px 12px; align-items: start; background: none; border: 0; padding: 4px 0; text-align: left; width: 100%; }
.adv + .adv { border-top: 1px solid var(--faint); padding-top: 10px; }
.coin { --d: 64px; width: var(--d); height: var(--d); border-radius: 50%; overflow: hidden; position: relative; grid-row: span 3; box-shadow: 0 0 0 2px var(--gold), 0 6px 16px rgba(0,0,0,.5); flex: none; display: block; }
.coin img { position: absolute; width: calc(var(--d) * 1.911); max-width: none; left: calc(var(--d) * -0.4555); top: calc(var(--d) * -0.2643); }
.adv .who { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; align-items: baseline; }
.adv .name { color: var(--gold-pale); font-size: 16px; }
.leaves { display: inline-flex; gap: 3px; }
.leaves i { width: 13px; height: 7px; border-radius: 50%; border: 1.5px solid var(--gold); opacity: .55; }
.leaves i.on { background: var(--gold); opacity: 1; }
.ab { font-size: 12.5px; color: var(--mute); }
.ab b { font-weight: 400; color: var(--gold); } .ab .sulk { color: var(--bad); }
.say { font: italic 500 17px/1.32 var(--f-voice); color: var(--ink); }

/* stage */
.stage { display: grid; gap: 16px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; perspective: 1200px; }
@media (max-width: 600px) { .cards { grid-template-columns: minmax(0, 1fr); } }
.card { position: relative; min-height: 240px; max-width: 100%; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.2, .7, .2, 1); border: 0; padding: 0; background: none; text-align: left; width: 100%; }
@media (max-width: 600px) { .card { min-height: 200px; } }
.card.flip { transform: rotateY(180deg); cursor: default; }
.card > div { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; border: 2px solid var(--gold); overflow: hidden; }
.card .back { background: repeating-linear-gradient(45deg, rgba(226,189,102,.08) 0 10px, transparent 10px 20px), var(--wine); display: grid; place-items: center; align-content: center; gap: 8px; }
.card .back span { font: 400 30px var(--f-display); color: var(--gold); letter-spacing: .1em; }
.card .back em { font: italic 500 17px var(--f-voice); color: var(--mute); }
.card:not(.flip):hover .back { box-shadow: inset 0 0 0 2px var(--gold-pale), 0 0 26px rgba(246,227,161,.25); }
.card .face { transform: rotateY(180deg); background: var(--wine); display: grid; grid-template-rows: auto 1fr auto; }
.card .band { padding: 7px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--gold-pale); }
.card[data-deck="land"] .band { background: var(--land); } .card[data-deck="sea"] .band { background: var(--seacard); } .card[data-deck="omen"] .band { background: var(--omen); }
.card .band svg { width: 22px; height: 22px; }
.card .body { padding: 10px 14px; display: grid; align-content: start; gap: 6px; min-width: 0; }
.card .title { font-size: 19px; line-height: 1.25; color: var(--gold-pale); text-wrap: balance; }
.card .hint { font: italic 500 16.5px/1.35 var(--f-voice); color: var(--mute); }
.card .eff { padding: 8px 14px; border-top: 1px solid var(--line); font-size: 14px; }
.card .eff.decide { color: var(--gold); letter-spacing: .14em; text-transform: uppercase; font-size: 12.5px; }
.card.quiet .face { opacity: .8; }
.card.active > div { box-shadow: 0 0 0 3px var(--gold-pale), 0 0 30px rgba(246, 227, 161, .35); }
.choice { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; align-items: start; text-align: left; width: 100%; background: rgba(44, 8, 25, .7); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.opt:hover:not(:disabled) { border-color: var(--gold); background: rgba(70, 18, 44, .85); }
.opt .key { grid-row: span 2; font: 400 24px/1 var(--f-display); color: var(--gold); min-width: 1.3em; }
.opt .what { color: var(--gold-pale); }
.opt .sub { font-size: 14px; color: var(--mute); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { background: linear-gradient(180deg, #f0d184, #c9993d); color: #2c0819; border: 0; border-radius: 999px; padding: 9px 22px; font-size: 14.5px; letter-spacing: .14em; text-transform: uppercase; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn.quiet { background: none; color: var(--gold-pale); border: 1px solid var(--line); }
.btn.small { padding: 5px 14px; font-size: 12.5px; }
.problems { margin: 0; padding-left: 20px; color: var(--bad); font-size: 14.5px; }

/* order desk */
.desk { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 14px; }
@media (max-width: 1100px) { .desk { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .desk .book { grid-column: 1 / -1; } }
@media (max-width: 680px) { .desk { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 10px; min-width: 0; align-content: start; }
.plan { border: 1px solid var(--faint); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; background: rgba(44, 8, 25, .45); }
.plan .ph { display: flex; align-items: center; gap: 10px; }
.plan .ph .coin { --d: 34px; box-shadow: 0 0 0 1.5px var(--gold); }
.plan .ph .mark { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--gold); display: grid; place-items: center; font: 400 17px var(--f-display); color: var(--gold); flex: none; }
.plan .ph div { min-width: 0; flex: 1; }
.plan .ph small { display: block; font-size: 12px; color: var(--mute); letter-spacing: .1em; text-transform: uppercase; }
.plan ul { margin: 0; padding-left: 18px; font-size: 14.5px; }
.groups { display: grid; gap: 10px; }
.group h4 { margin: 0 0 6px; font: 400 12px var(--f-label); letter-spacing: .22em; text-transform: uppercase; color: var(--mute); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.act { background: rgba(44, 8, 25, .6); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 14px; color: var(--gold-pale); text-align: left; }
.act:hover { border-color: var(--gold); background: rgba(70, 18, 44, .85); }
.act small { color: var(--mute); margin-left: 6px; font-size: 12px; }
textarea, input[type=number], select { background: var(--wine); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: 15.5px var(--f-label); max-width: 100%; }
textarea { width: 100%; min-height: 64px; resize: vertical; }
.book ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; counter-reset: o; }
.book li { counter-increment: o; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 7px 10px; border: 1px solid var(--faint); border-radius: 10px; font-size: 14.5px; }
.book li::before { content: counter(o, upper-roman); font: 400 15px var(--f-display); color: var(--gold); min-width: 2.1em; }
.book li.bad { border-color: var(--bad); }
.book li em { color: var(--bad); font-style: normal; display: block; font-size: 13px; }
.book li button { background: none; border: 0; color: var(--mute); font-size: 18px; line-height: 1; padding: 0 4px; }
.book li button:hover { color: var(--bad); }
.slots { display: flex; gap: 3px; flex-wrap: wrap; }
.slots i { width: 14px; height: 6px; border-radius: 3px; background: var(--faint); }
.slots i.on { background: var(--gold); }
.cost { font-size: 14px; color: var(--mute); font-variant-numeric: tabular-nums; }
.cost b { color: var(--gold-pale); font-weight: 400; }
.short { color: var(--bad) !important; }

/* report */
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
.notes li { padding-left: 18px; position: relative; max-width: 78ch; }
.notes li::before { content: "◆"; position: absolute; left: 0; top: .1em; font-size: 10px; color: var(--gold); }
.notes li.history { font: italic 500 18px/1.4 var(--f-voice); color: var(--mute); }
.changes { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
.changes td { padding: 4px 8px; border-bottom: 1px solid var(--faint); }
.changes td:nth-child(n+2) { text-align: right; }

/* overlay */
.veil { position: fixed; inset: 0; background: rgba(6, 5, 16, .78); display: grid; place-items: center; padding: 20px; z-index: 20; backdrop-filter: blur(3px); }
.dialog { width: min(600px, 100%); max-height: calc(100% - 20px); overflow: auto; background: linear-gradient(180deg, #1b1a3e, #2c1c48); border: 2px solid var(--gold); border-radius: 18px; padding: 20px; display: grid; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.dialog.wide { width: min(780px, 100%); }
.dialog .head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.dialog .head .coin { --d: 80px; }
.dialog .ability { font: 400 24px/1.1 var(--f-display); color: var(--gold); }
.dialog .uses { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--mute); }
.die-stage { justify-items: center; text-align: center; }
.die-stage .die { width: min(230px, 58vw); }
.die-stage .die svg { width: 100%; height: auto; display: block; }
.spin .die svg, .corner.die.spin svg { animation: tumble .12s linear infinite; }
@keyframes tumble { 0% { transform: rotate(-14deg) scale(.94); } 50% { transform: rotate(10deg) scale(1.03); } 100% { transform: rotate(-14deg) scale(.94); } }
.verdict { font: 400 30px var(--f-display); color: var(--gold); min-height: 1.2em; }
.verdict.bad { color: var(--bad); }
.fullcard { width: min(400px, 100%); border-radius: 18px; display: block; margin: 0 auto; }
.picklist { display: grid; gap: 6px; }
.pick { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; width: 100%; background: rgba(44, 8, 25, .6); border: 1px solid var(--faint); border-radius: 12px; padding: 8px 12px; }
.pick:hover:not(:disabled) { border-color: var(--gold); }
.pick .t { color: var(--gold-pale); }
.pick .d { font-size: 13.5px; color: var(--mute); }
.pick .c { font-size: 13.5px; color: var(--mute); text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .pick { grid-template-columns: 38px minmax(0, 1fr); } .pick .c { grid-column: 2; text-align: left; } }
.trade { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.trade th { font-weight: 400; color: var(--mute); text-align: left; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; padding: 4px 6px; }
.trade td { padding: 4px 6px; border-top: 1px solid var(--faint); }
.trade input { width: 74px; }
.meter { height: 8px; border-radius: 4px; background: var(--faint); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--gold); }
.meter.over i { background: var(--bad); }
.townpick { display: flex; flex-wrap: wrap; gap: 6px; }
.townpick button { background: rgba(44, 8, 25, .6); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; color: var(--gold-pale); }
.townpick button[aria-pressed="true"] { background: var(--gold); color: var(--wine); }

/* corners: compass and die */
.corner { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 15; background: rgba(15, 20, 48, .94); border: 1.5px solid var(--gold); border-radius: 50%; width: 92px; height: 92px; padding: 0; display: grid; place-items: center; box-shadow: 0 8px 26px rgba(0,0,0,.55); }
.corner.compass { left: calc(14px + env(safe-area-inset-left, 0px)); }
.corner.die { right: calc(14px + env(safe-area-inset-right, 0px)); border-radius: 18px; }
.corner svg { width: 80px; height: 80px; display: block; }
.corner .cap { position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%); background: var(--night); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-pale); white-space: nowrap; }
@media (max-width: 600px) { .corner { width: 70px; height: 70px; } .corner svg { width: 60px; height: 60px; } }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 16; display: grid; gap: 6px; width: min(520px, calc(100% - 230px)); pointer-events: none; }
@media (max-width: 600px) { .toasts { width: calc(100% - 180px); } }
.toast { background: rgba(27, 26, 62, .96); border: 1px solid var(--gold); border-radius: 12px; padding: 8px 12px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
footer { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; color: var(--mute); font-size: 13.5px; }
footer .opts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
footer .opts button { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; color: var(--mute); }
footer .opts button[aria-pressed="true"] { color: var(--gold-pale); border-color: var(--gold); }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .spin .die svg, .corner.die.spin svg { animation: none; } }
</style>

<div class="wrap">
  <header>
    <div class="brand"><h1>Illyria</h1><span>AD 30 · The Governor</span></div>
    <div class="when"><span id="when"></span><button class="ghost" id="newgame" type="button">New game</button></div>
  </header>
  <section class="ledger" id="ledger" aria-label="The town's numbers"></section>
  <div class="table">
    <div class="board">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-city" aria-selected="true" aria-controls="sheet-city" type="button"><b>Acruvium</b> city sheet</button>
        <button class="tab" role="tab" id="tab-sea" aria-selected="false" aria-controls="sheet-sea" type="button"><b>Adriatic</b> map</button>
      </div>
      <section class="sheet" id="sheet-city" role="tabpanel" aria-labelledby="tab-city"></section>
      <section class="sheet" id="sheet-sea" role="tabpanel" aria-labelledby="tab-sea" hidden></section>
    </div>
    <section class="panel"><p class="eyebrow">Your council</p><div class="council" id="council"></div></section>
  </div>
  <div class="stage" id="stage"></div>
  <footer>
    <span>Phase 0 playtest · rules v2 · all numbers DRAFT</span>
    <span class="opts" id="opts"></span>
  </footer>
</div>

<script>
(function () {
  const E = window.Engine, D = window.GAME_DATA;
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const KEY = "illyria-web-save-v2", STONE_KEY = "illyria-die", SOUND_KEY = "illyria-sound";
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
  let s = null, wants = {}, say = {}, book = [], phase = "intro", stone = store.get(STONE_KEY) || "obsidian", sound = store.get(SOUND_KEY) !== "off";
  if (!D.dice[stone]) stone = "obsidian";
  const reduce = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const clean = (t) => String(t || "").replace("DRAFT. ", "").replace("DRAFT.", "");

  // ---------- sound, made on the spot with Web Audio (no files) ----------
  let ac = null;
  function audio() { if (!sound) return null; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); return ac; } catch (e) { return null; } }
  function noise(a, dur) { const b = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; const n = a.createBufferSource(); n.buffer = b; return n; }
  function rustle() {   // parchment turned over
    const a = audio(); if (!a) return;
    [0, .09, .2].forEach((t0, k) => {
      const n = noise(a, .32), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + t0;
      f.type = "bandpass"; f.frequency.value = 1800 + k * 900; f.Q.value = .8;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.16 - k * .03, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .3);
      n.connect(f).connect(g).connect(a.destination); n.start(t); n.stop(t + .33);
    });
  }
  function gong() {     // a bronze gong for the omens
    const a = audio(); if (!a) return;
    const t = a.currentTime, out = a.createGain(); out.gain.value = .22; out.connect(a.destination);
    [[1, .9], [2.32, .5], [2.76, .45], [3.71, .3], [4.5, .2], [5.9, .12]].forEach(([r, v], i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.frequency.value = 98 * r * (1 + (i % 2 ? .003 : -.002));
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(.0008, t + 4.2 - i * .4);
      o.connect(g).connect(out); o.start(t); o.stop(t + 4.4);
    });
    const n = noise(a, .08), f = a.createBiquadFilter(), g = a.createGain();
    f.type = "lowpass"; f.frequency.value = 400; g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.001, t + .08);
    n.connect(f).connect(g).connect(out); n.start(t);
  }
  function clatter() {  // the die on the table
    const a = audio(); if (!a) return;
    [0, .07, .16, .29, .45].forEach((t0, k) => {
      const n = noise(a, .03), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + t0;

      n.connect(f).connect(g).connect(a.destination); n.start(t);
    });
  }

    fishery: '<path d="M-16,0c6,-9 18,-9 24,0c-6,9 -18,9 -24,0ZM8,0l9,-7v14ZM-9,-2v.1M-14,14h28M-10,10h20"/>',
    saltpans: '<path d="M-16,-12h14v10h-14ZM2,-12h14v10h-14ZM-16,2h14v10h-14ZM2,2h14v10h-14Z"/><path d="M-10,-7h2M8,7h2M-10,7h2"/>',
    woodcutters: '<path d="M-16,12h20l4,-6h-20ZM-12,6l4,-6h20l-4,6M4,-16l12,12M14,-12l-6,-6l4,-2l4,4Z"/>',
    mine: '<path d="M-14,14L8,-8M-4,-16c10,0 18,6 20,14c-6,-6 -12,-8 -20,-8ZM-16,14h32"/>',
  };
  const icon = (k, size = 40) => `<svg viewBox="-20 -20 40 40" width="${size}" height="${size}" fill="none" stroke="#e2bd66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k] || ""}</svg>`;

  // ---------- ledger and stores ----------
  function ledger(before) {
    $("ledger").innerHTML = E.CORE.map((n) => {
      const r = E.RULES[n], v = s[n], d = before ? v - before[n] : 0;
      const warn = (n === "grain" && v < 3) || ((n === "loyalty" || n === "favour") && v < 30);
      const delta = Math.abs(d) >= 0.05 ? `<span class="${d > 0 ? "up" : "down"}">${d > 0 ? "+" : "−"}${E.fmt(n, Math.abs(d))}</span>` : "";
      const unit = n === "loyalty" || n === "favour" ? "of 100" : n === "grain" ? "months of food" : r.unit;
      return `<div class="num${warn ? " warn" : ""}"><span class="k">${esc(r.name)}</span><span class="v">${E.fmt(n, v)}</span><span class="u">${esc(unit)} ${delta}</span></div>`;

    const [season, year] = E.seasonOf(s.turn);
    $("when").innerHTML = `Turn <b>${s.turn}</b> · <b>${season.season}, AD ${year}</b> · taxes <b>${s.tax}</b>`;
  }
  function storesHTML(before) {
    const groups = [["local", "Made in Acruvium"], ["import", "Only by sea"], ["luxury", "Rare goods"]];

    }).join("")}</div>`;
  }

  // ---------- the city sheet ----------
  const TOWN_SLOTS = [], FIELD_SLOTS = [];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) TOWN_SLOTS.push([150 + c * 92, 214 + r * 78]);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) FIELD_SLOTS.push([586 + c * 92 + r * 14, 196 + r * 82]);
  for (let c = 0; c < 4; c++) FIELD_SLOTS.push([600 + c * 92, 100]);   // hillside terraces, cleared one by one
  /** A hillside plot not yet cleared (or being cleared): scrub, click to order the clearing. */
  function scrubSVG(x, y, left) {
    const w = 80, h = 66;
    return `<g class="plot-hit" tabindex="0" role="button" aria-label="${left ? `Being cleared, ready in ${left} season${left > 1 ? "s" : ""}` : "Scrub on the hillside: clear it for a new field"}" data-clear="1" transform="translate(${x},${y})">

  function plotSVG(b, x, y, zone, i) {
    const w = 80, h = 66;
    if (!b) return `<g class="plot-hit" tabindex="0" role="button" aria-label="Free plot ${zone === "town" ? "inside the walls" : "in the fields"}: build here" data-zone="${zone}" transform="translate(${x},${y})">

  function shipSVG(x, y, scale = 1, ghost = false) {

  function citySVG() {

      <path d="M0,170 L60,120 L130,140 L210,60 L300,95 L370,30 L450,80 L520,40 L620,100 L700,70 L790,120 L880,85 L1000,130 V470 H0Z" fill="url(#mount)"/>

      ${[0, 1, 2, 3].map((k) => `<path d="M${40 + k * 240},${560 + (k % 2) * 18} q20,-8 40,0 t40,0" fill="none" stroke="rgba(246,227,161,.18)" stroke-width="1.5"/>`).join("")}

      ${TOWN_SLOTS.map(([x, y], i) => plotSVG(town[i], x, y, "town", i)).join("")}
      ${FIELD_SLOTS.map(([x, y], i) => {
        const open = E.fieldPlots(s), clearing = [...(s.clearing || [])].sort((a, b) => a - b);
        if (i < open) return plotSVG(fields[i], x, y, "field", i);

        return scrubSVG(x, y, k < clearing.length ? clearing[k] - s.turn : 0);
      }).join("")}
      ${ships}${keels}
    </svg>`;
  }
  function cityView(before) {
    const free = Math.max(0, Math.trunc(s.ships) - E.shipsAtSea(s));
    $("sheet-city").innerHTML = `<div class="mapwrap" id="citymap">${citySVG()}</div>
      <div class="legend"><span>${E.plotsUsed(s, "town")}/${E.TOWN_PLOTS} plots in town, ${E.plotsUsed(s, "field")}/${E.fieldPlots(s)} in the fields (up to ${E.FIELD_PLOTS_MAX})</span>

      <span><i style="background:#2c0819;border:1px dashed #e2bd66"></i>being built</span><span><i style="background:#1f3a22;border:1px solid #9fdcae"></i>growing</span></div>
      ${storesHTML(before)}`;
    $("citymap").querySelectorAll(".plot-hit").forEach((g) => {
      const go = () => (g.dataset.clear ? clearHere() : g.dataset.zone ? buildPicker(g.dataset.zone) : plotInfo(g.dataset.plot));
      g.addEventListener("click", go);
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });

  }
  function clearHere() {
    if (phase !== "orders") { toast("Orders are given after the season's cards are read."); return; }
    addOrders([E.order("clear_land")]);
  }
  function plotInfo(id) {
    const [zone, i] = id.split("-"); const b = sortedPlots(zone)[+i]; if (!b) return;
    const B = E.BLD[b.kind], st = E.buildingState(s, b);
    const yields = B.produces ? `Yields ${E.listText(E.parseList(B.produces))}${B.uses ? `, using ${E.listText(E.parseList(B.uses))}` : ""}, ${B.yields_in && B.yields_in !== "any" ? `each ${B.yields_in}` : "every season"}.` : "";
    openVeil(`<div class="dialog" role="dialog" aria-label="${esc(B.name)}"><div class="head"><span>${icon(b.kind, 56)}</span><div><h2 style="margin:0">${esc(B.name)}</h2><span class="sum">${esc(st.text)}</span></div></div>
      <p style="margin:0">${esc(clean(B.notes))}</p>${yields ? `<p class="sum" style="margin:0">${esc(yields)}</p>` : ""}
      <div class="row"><button class="btn" type="button" data-close>Close</button></div></div>`);
  }

  // ---------- the Adriatic map ----------
  const M = D.map;
  const P = (lon, lat) => [(lon - M.lon0) * M.kx, (M.lat1 - lat) * M.ky];
  const ACRV = [18.77, 42.43];
  const routePts = (t) => [ACRV].concat(String(t.route).split(";").map((p) => p.trim().split(/\s+/).map(Number)).filter((p) => p.length === 2), [[+t.lon, +t.lat]]).map(([a, b]) => P(a, b));
  const routePath = (pts) => "M" + pts.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" L");
  function along(pts, f) {
    const seg = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]));
    let d = seg.reduce((a, b) => a + b, 0) * f;
    for (let i = 0; i < seg.length; i++) { if (d <= seg[i]) { const k = d / seg[i]; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k]; } d -= seg[i]; }
    return pts[pts.length - 1];
  }
  let selectedTown = null;
  function seaView() {
    const [ax, ay] = P(...ACRV);
    const routes = E.TOWNS.map((t) => { const pts = routePts(t), mid = along(pts, .55);
      return `<path d="${routePath(pts)}" fill="none" stroke="#f6e3a1" stroke-width="2.2" stroke-dasharray="1 7" stroke-linecap="round" opacity="${selectedTown === t.id ? 1 : .5}"/>
        ${selectedTown === t.id ? `<text x="${(mid[0] + 10).toFixed(1)}" y="${(mid[1] + 4).toFixed(1)}" font-family="Marcellus" font-size="14" fill="#f6e3a1">${t.days} day${t.days > 1 ? "s" : ""}' sailing</text>` : ""}`; }).join("");
    const towns = E.TOWNS.map((t) => { const [x, y] = P(+t.lon, +t.lat), left = ["dyrrachium", "epidaurum", "brundisium", "ancon", "pola"].includes(t.id);
      return `<g class="town-hit" tabindex="0" role="button" aria-label="${esc(t.name)}: what it sells and buys" data-town="${t.id}">
        <circle cx="${x}" cy="${y}" r="16" fill="transparent"/>
        <circle class="dot" cx="${x}" cy="${y}" r="7" fill="${selectedTown === t.id ? "#f6e3a1" : "#2c0819"}" stroke="#e2bd66" stroke-width="2.5"/>
        <text x="${x + (left ? -12 : 12)}" y="${y + 6}" text-anchor="${left ? "end" : "start"}" font-family="Marcellus" font-size="18" fill="#f6e3a1">${esc(t.name)}</text>
</g>`; }).join("");
    const convoys = s.convoys.map((c) => { const t = E.TOWN[c.town], span = Math.max(1, c.arrive - c.out), f = Math.min(.95, Math.max(.05, (s.turn - c.out + .5) / span));
      const [x, y] = along(routePts(t), f <= .5 ? f * 2 * .92 : (1 - f) * 2 * .92); return shipSVG(x, y - 4, .5); }).join("");
    const lbl = (lon, lat, text, size, rot = 0, op = .35, fam = "Marcellus") => { const [x, y] = P(lon, lat); return `<text x="${x}" y="${y}" font-family="${fam}" font-size="${size}" letter-spacing="${size / 3}" fill="rgba(246,227,161,${op})" ${rot ? `transform="rotate(${rot} ${x} ${y})"` : ""}>${text}</text>`; };
    $("sheet-sea").innerHTML = `<div class="mapwrap"><svg viewBox="0 0 ${M.w} ${M.h}" role="img" aria-label="Map of the Adriatic with Acruvium and the trading towns">
      <defs><radialGradient id="seag" cx=".55" cy=".55" r=".8"><stop offset="0" stop-color="#174468"/><stop offset="1" stop-color="#0b2440"/></radialGradient></defs>
      <rect width="${M.w}" height="${M.h}" fill="url(#seag)"/>
      <path d="${M.land}" fill="#2f2450" stroke="#e2bd66" stroke-width="1" stroke-linejoin="round"/>
      ${lbl(13.6, 42.55, "MARE HADRIATICVM", 24, -38, .28, "Caesar Dressing, Marcellus")}${lbl(16.9, 44.9, "DALMATIA", 22)}${lbl(13.1, 41.6, "ITALIA", 22)}${lbl(19.6, 42.2, "MOESIA", 14, 0, .25)}
      ${routes}${towns}
      <g transform="translate(${ax},${ay})"><path d="M0,-14 L3.8,-4.5 14,-4.5 6,2 8.6,12.5 0,6.5 -8.6,12.5 -6,2 -14,-4.5 -3.8,-4.5Z" fill="#e2bd66" stroke="#2c0819" stroke-width="1"/></g>
      <text x="${ax + 16}" y="${ay + 6}" font-family="Caesar Dressing, Marcellus" font-size="20" fill="#e2bd66">ACRVVIVM</text>
      ${convoys}
    </svg></div>
    <p class="sum" style="margin:0">Click a town to see what it sells and buys this season. Prices move with the wind and current, so north and south are not the same voyage.${s.convoys.length ? ` ${s.convoys.length} of your ships are at sea.` : ""}</p>
    <div class="towninfo" id="towninfo">${selectedTown ? townInfo(selectedTown) : ""}</div>`;
    $("sheet-sea").querySelectorAll(".town-hit").forEach((g) => {
      const go = () => { selectedTown = g.dataset.town; seaView(); };
      g.addEventListener("click", go);
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    });
    const send = $("sendhere"); if (send) send.onclick = () => convoyBuilder(selectedTown);
  }
  function townInfo(id) {
    const t = E.TOWN[id];
    const rows = (side) => Object.keys(side === "buy" ? t.sellsTo : t.buysFrom).map((g) => `<tr><td>${esc(E.nameOf(g))}</td><td>${E.intc(E.priceAt(s, id, g, side))}</td><td>${g === "grain" ? "a month's supply" : "each"}</td></tr>`).join("");
    return `<h2 style="margin:0">${esc(t.name)}</h2><p class="sum" style="margin:0">${esc(clean(t.notes))} ${t.days} day${t.days > 1 ? "s" : ""}' sailing; ${t.seasons > 1 ? "there and back takes two seasons" : "back next season"}.</p>
      <div class="twocol"><div><p class="eyebrow">Sells to you</p><table class="prices"><tbody>${rows("buy")}</tbody></table></div>
      <div><p class="eyebrow">Buys from you</p><table class="prices"><tbody>${rows("sell")}</tbody></table></div></div>
      ${phase === "orders" ? `<div class="row"><button class="btn small" type="button" id="sendhere">Send a convoy to ${esc(t.name)}</button></div>` : ""}`;
  }

  // ---------- council ----------
  const coin = (aid) => `<span class="coin"><img src="img/advisor-${aid}.webp" alt=""></span>`;
  function councilView() {
    $("council").innerHTML = E.COUNCIL_ORDER.map((aid) => {
      const a = E.ADVISORS[aid], st = s.council[aid], state = E.abilityState(s, aid);
      const leaves = Array.from({ length: E.MOOD_MAX }, (_, i) => `<i class="${i < st.mood ? "on" : ""}"></i>`).join("");
      return `<button class="adv" type="button" data-aid="${aid}" aria-label="Show ${esc(a.name)}'s card">${coin(aid)}
        <span class="who"><span class="name">${esc(a.name)}</span><span class="leaves" title="Mood ${st.mood} of ${E.MOOD_MAX}">${leaves}</span></span>
        <span class="ab">${esc(a.title)} · <b>${esc(a.ability_name)}</b>: <span class="${state === "sulking" ? "sulk" : ""}">${state}</span></span>
        <span class="say">${say[aid] ? "“" + esc(say[aid]) + "”" : esc(a.voice)}</span></button>`;
    }).join("");
  }
  $("council").addEventListener("click", (e) => {
    const b = e.target.closest(".adv"); if (!b) return;
    const a = E.ADVISORS[b.dataset.aid];
    openVeil(`<div class="dialog" role="dialog" aria-label="${esc(a.name)}"><img class="fullcard" src="img/advisor-${b.dataset.aid}.webp" alt="${esc(a.name)}, ${esc(a.title)}">
      <div class="row"><button class="btn" type="button" data-close>Close</button></div></div>`);
  });

  // ---------- corners: compass and die ----------
  const DIRS = { N: 0, NE: 45, E: 90, SE: 135, S: 180, SW: 225, W: 270, NW: 315 };
  function compassView() {
    const w = E.WINDS[s.wind], a = DIRS[s.wind];
    // the arrow starts on the side the wind comes from and points where it blows
    const arrow = a === undefined ? `<circle r="9" fill="none" stroke="#f6e3a1" stroke-width="2" stroke-dasharray="2 3"/>`
      : `<g transform="rotate(${a})"><path d="M0,26 L6,10 L2,10 L2,-22 L-2,-22 L-2,10 L-6,10Z" fill="#f6e3a1"/><path d="M-6,-24 q6,-5 12,0 M-6,-30 q6,-5 12,0" stroke="#f6e3a1" stroke-width="1.6" fill="none"/></g>`;
    $("compass").innerHTML = `<svg viewBox="-41 -41 82 82" aria-hidden="true"><circle r="38" fill="#2c0819" stroke="#e2bd66" stroke-width="2"/>
      ${["N", "E", "S", "W"].map((d, i) => `<text x="${(Math.sin(i * Math.PI / 2) * 31).toFixed(1)}" y="${(-Math.cos(i * Math.PI / 2) * 31 + 3.5).toFixed(1)}" text-anchor="middle" font-family="Marcellus" font-size="10" fill="#e2bd66">${d}</text>`).join("")}
      ${arrow}</svg><span class="cap">${esc(w.id === "CALM" ? "calm" : w.latin)}</span>`;
    $("compass").setAttribute("aria-label", `Wind: ${w.id === "CALM" ? "dead calm" : w.latin + " from the " + w.from}. Click for details.`);
  }
  $("compass").onclick = () => {
    const w = E.WINDS[s.wind], [n] = E.sailing(s, true), [so] = E.sailing(s, false);
    const fc = s.forecast && s.forecast.turn === s.turn + 1 ? E.WINDS[s.forecast.wind] : null;
    openVeil(`<div class="dialog" role="dialog" aria-label="Wind and current"><img src="img/wind-${s.wind}.webp" alt="${esc(w.latin)}" style="width:100%;border-radius:12px">
      <p style="margin:0">Current ${E.CURRENT_TEXT[s.current]}. Convoys north ${E.pct(n)}, south ${E.pct(so)} on prices. Harvest ${E.pct(E.num(w.harvest_mult, 1) - 1)}.</p>
      ${fc ? `<p class="sum" style="margin:0">The sages say next season brings ${fc.id === "CALM" ? "a dead calm" : fc.latin + ", from the " + fc.from}.</p>` : ""}
      <div class="row"><button class="btn" type="button" data-close>Close</button></div></div>`);
  };
  function cornerDie() {
    const r = s && s.last_roll;
    $("cornerdie").innerHTML = D.dice[stone][(r ? r.r : 20) - 1] + `<span class="cap">${r ? "rolled " + r.r : "d20"}</span>`;
  }
  $("cornerdie").onclick = () => {
    const r = s.last_roll;
    openVeil(`<div class="dialog die-stage" role="dialog" aria-label="The last roll"><div class="die">${D.dice[stone][(r ? r.r : 20) - 1]}</div>
      <p style="margin:0">${r ? `${esc(r.why)}: rolled ${r.r}${r.bonus ? ` ${r.bonus > 0 ? "+" : "−"} ${Math.abs(r.bonus)} = ${r.total}` : ""}, needed ${r.target}. ${esc(r.tag)}.` : "No die has been rolled yet. The d20 decides battles, risky choices on the cards, and every voyage home."}</p>
      <div class="row" style="justify-content:center"><button class="btn" type="button" data-close>Close</button></div></div>`);
  };
  function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; $("toasts").appendChild(d); setTimeout(() => d.remove(), 6000); }

  // ---------- overlay ----------
  function openVeil(html) { const v = $("veil"); v.innerHTML = html; v.hidden = false; v.querySelectorAll("[data-close]").forEach((b) => (b.onclick = closeVeil)); const f = v.querySelector("button, input, select"); if (f) f.focus(); }
  function closeVeil() { $("veil").hidden = true; $("veil").innerHTML = ""; }
  $("veil").addEventListener("click", (e) => { if (e.target === $("veil") && $("veil").dataset.lock !== "1") closeVeil(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("veil").hidden && $("veil").dataset.lock !== "1") closeVeil(); });
  function modal(html) { $("veil").dataset.lock = "1"; openVeil(html); }
  function unmodal() { delete $("veil").dataset.lock; closeVeil(); }
  const options = (opts) => opts.map((o, i) => `<button class="opt" type="button" data-i="${i}"><span class="key">${"ABCDEFG"[i]}</span><span class="what">${esc(o.label)}</span><span class="sub">${esc(o.sub || "")}</span></button>`).join("");
  const waitPick = (root) => new Promise((res) => root.querySelectorAll("[data-i]").forEach((b) => (b.onclick = () => res(+b.dataset.i))));

  const DECK_ICON = {
    land: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 22V6"/><path d="M12 9c-3-1-4-4-4-6 3 1 4 3 4 6zM12 9c3-1 4-4 4-6-3 1-4 3-4 6zM12 14c-3-1-4-4-4-6 3 1 4 3 4 6zM12 14c3-1 4-4 4-6-3 1-4 3-4 6z"/></svg>',
    sea: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 9c3-3 5 3 8 0s5 3 8 0 3-1 4 0M2 14c3-3 5 3 8 0s5 3 8 0 3-1 4 0M2 19c3-3 5 3 8 0s5 3 8 0 3-1 4 0"/></svg>',
    omen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M12 2v2M5 4l1.5 1.5M19 4l-1.5 1.5"/></svg>',
  };
  function cardHTML(c, i, flipped) {
    const eff = c.choice ? `<div class="eff decide">Your decision</div>` : `<div class="eff">${esc(E.effectsText(c.effects))}</div>`;
    const who = c.advisor && E.ADVISORS[c.advisor] ? ` · ${E.ADVISORS[c.advisor].name}` : "";
    const hint = c.choice ? String(c.choice.prompt).replace(/\s+/g, " ") : c.scribe_hint || "";
    return `<button class="card${c.quiet ? " quiet" : ""}${flipped ? " flip" : ""}" data-deck="${c.deck}" id="card-${i}" type="button" aria-label="${flipped ? esc(c.title) : `Turn over the ${E.DECK_LABEL[c.deck]} card`}">
      <div class="back"><span>${E.DECK_LABEL[c.deck].toUpperCase()}</span><em>click to turn over</em></div>
      <div class="face"><div class="band"><span>${E.DECK_LABEL[c.deck]}${esc(who)}</span>${DECK_ICON[c.deck]}</div>
      <div class="body"><span class="title">${esc(c.title)}</span><span class="hint">${esc(hint)}</span></div>${eff}</div></button>`;
  }

  // ---------- what the engine asks of the page ----------
  let seasonCards = [];
  const ui = {
    async reveal(cards) {
      seasonCards = cards;
      $("cards").innerHTML = cards.map((c, i) => cardHTML(c, i, false)).join("");
      $("cardhint").textContent = "Turn each card over to read it.";
      await new Promise((done) => {
        let left = cards.length;
        cards.forEach((c, i) => {
          const el = $("card-" + i);
          el.onclick = () => {
            if (el.classList.contains("flip")) return;
            el.classList.add("flip"); el.setAttribute("aria-label", c.title);
            (c.deck === "omen" ? gong : rustle)();
            if (--left === 0) setTimeout(done, reduce() ? 50 : 850);
          };
        });
      });
      $("cardhint").textContent = cards.some((c) => c.choice) ? "Some cards ask for your decision." : "The cards are read.";
    },
    async cardChoice(c, opts) {
      const i = seasonCards.indexOf(c);
      document.querySelectorAll(".card").forEach((el) => el.classList.remove("active"));
      if (i >= 0) $("card-" + i).classList.add("active");
      const box = $("decide");
      box.innerHTML = `<p class="eyebrow">${E.DECK_LABEL[c.deck]} · your decision</p><h2>${esc(c.title)}</h2>
        <p class="voice">${esc(String(c.choice.prompt).replace(/\s+/g, " "))}</p><div class="choice" style="margin-top:10px">${options(opts)}</div>`;
      box.hidden = false;
      box.scrollIntoView({ behavior: reduce() ? "auto" : "smooth", block: "nearest" });
      const pick = await waitPick(box);
      box.hidden = true;
      if (i >= 0) $("card-" + i).classList.remove("active");
      return pick;
    },
    async roll(r, quiet) {
      const faces = D.dice[stone], corner = $("cornerdie");
      s.last_roll = r;
      clatter();
      corner.classList.add("spin");
      if (quiet) {
        for (let k = 0; k < (reduce() ? 1 : 8); k++) { corner.innerHTML = faces[Math.floor(Math.random() * 20)]; await sleep(60 + k * 10); }
        corner.classList.remove("spin"); cornerDie();
        toast(`${r.why}: rolled ${r.r}${r.bonus ? ` ${r.bonus > 0 ? "+" : "−"} ${Math.abs(r.bonus)}` : ""} (need ${r.target}) · ${r.tag}`);
        return;
      }
      modal(`<div class="dialog die-stage spin" role="dialog" aria-label="Dice roll"><p class="eyebrow" style="margin:0">${esc(r.why)}</p>
        <div class="die" id="die">${faces[19]}</div><div class="verdict" id="verdict" aria-live="polite"></div><div class="sum" id="dsum">d${r.die}${r.bonus ? ` + ${r.bonus}` : ""} · need ${r.target}</div>
        <div class="row" style="justify-content:center"><button class="btn" type="button" id="dieok" hidden>Continue</button></div></div>`);
      const stage = $("veil").firstElementChild;
      for (let k = 0; k < (reduce() ? 1 : 12); k++) { $("die").innerHTML = faces[Math.floor(Math.random() * 20)]; await sleep(55 + k * 9); }
      stage.classList.remove("spin"); corner.classList.remove("spin"); cornerDie();
      $("die").innerHTML = faces[r.r - 1];
      $("verdict").textContent = r.tag;
      $("verdict").classList.toggle("bad", !r.ok);
      $("dsum").textContent = `rolled ${r.r}${r.bonus ? ` ${r.bonus >= 0 ? "+" : "−"} ${Math.abs(r.bonus)} = ${r.total}` : ""} · needed ${r.target}`;
      const ok = $("dieok"); ok.hidden = false; ok.focus();
      await new Promise((res) => (ok.onclick = res));
      unmodal();
    },
    async ability(aid, question) {
      const a = E.ADVISORS[aid];
      modal(`<div class="dialog" role="dialog" aria-label="${esc(a.name)}"><div class="head">${coin(aid)}<div><div class="ability">${esc(a.ability_name)}</div>
        <div class="uses">${esc(a.name)} · ${a.ability_uses === "game" ? "once per governorship" : "once a year"}</div></div></div>
        <p class="voice">“${esc(question)}”</p>
        <div class="row"><button class="btn" type="button" data-i="1">Yes, do it</button><button class="btn quiet" type="button" data-i="0">No</button></div></div>`);
      const yes = await waitPick($("veil"));
      unmodal();
      return yes === 1;
    },
    async choose(title, text, opts) {
      modal(`<div class="dialog" role="dialog" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${text ? `<p class="voice">${esc(text)}</p>` : ""}<div class="choice">${options(opts)}</div></div>`);

      unmodal();
      return i;
    },
    async number(text, lo, hi) {
      modal(`<div class="dialog" role="dialog" aria-label="${esc(text)}"><h2>${esc(text)}</h2>
        <div class="row"><input type="number" id="numin" min="${lo}" max="${hi}" value="${hi}"> <span class="sum">${lo} to ${hi}</span></div>
        <div class="row"><button class="btn" type="button" id="numok">Agreed</button></div></div>`);
      const v = await new Promise((res) => ($("numok").onclick = () => res(Math.max(lo, Math.min(hi, parseInt($("numin").value, 10) || lo)))));
      unmodal();
      return v;
    },
  };
  E.setUI(ui);

  function refresh(before) { ledger(before); councilView(); cityView(before); seaView(); compassView(); cornerDie(); }

  // ---------- tabs ----------
  function showTab(which) {
    const city = which === "city";
    $("tab-city").setAttribute("aria-selected", String(city)); $("tab-sea").setAttribute("aria-selected", String(!city));
    $("sheet-city").hidden = !city; $("sheet-sea").hidden = city;
  }
  $("tab-city").onclick = () => showTab("city");
  $("tab-sea").onclick = () => showTab("sea");

  // ---------- the season ----------
  function save() { store.set(KEY, JSON.stringify(s)); }
  async function startSeason() {
    phase = "cards";
    E.rollWeather(s);
    say = {}; book = [];
    refresh();
    const [season, year] = E.seasonOf(s.turn);
    $("stage").innerHTML = `<section class="panel"><p class="eyebrow">${season.season}, AD ${year} · the season's cards</p>
      <h2>Three cards: the land, the sea and the gods</h2><p class="sum" id="cardhint" style="margin:0 0 10px"></p><div class="cards" id="cards"></div></section>
      <section class="panel" id="decide" hidden></section><section class="panel" id="orders" hidden></section>`;
    if (s.cards_turn !== s.turn) {
      s.before = Object.fromEntries(E.NUMBERS.map((n) => [n, s[n]]));
      const notes = [];
      const cards = await E.revealCards(s, notes);
      s.season_cards = cards.map((c) => c.id);
      s.season_notes = notes;
      s.cards_turn = s.turn;
      save();
    } else {
      const cards = (s.season_cards || []).map((id) => D.cards.find((c) => c.id === id)).filter(Boolean);
      $("cards").innerHTML = cards.map((c, i) => cardHTML(c, i, true)).join("");
      $("cardhint").textContent = "This season's cards, already read.";
    }
    ordersPhase();
  }

  // ---------- the order desk: plans, actions, the order book ----------
  const GROUPS = [["Treasury and law", ["raise_taxes", "lower_taxes", "hear_petitions", "hang_brigands"]],
    ["Building and planting", ["build", "clear_land"]], ["Sea and trade", ["send_convoy", "merchants", "build_ship"]], ["The garrison", ["recruit", "dismiss"]],
    ["Gods and Rome", ["visit_temple", "hold_festival", "honour_tiberius", "honour_rome"]], ["The council", ["listen_sages"]]];
  const PLAN_MARK = { bold: "A", prudent: "B" };
  let plansNow = [];
  function ordersPhase() {
    phase = "orders";
    ({ wants, say } = E.council(s));
    plansNow = E.plans(s);
    refresh(s.before);
    const box = $("orders");
    box.hidden = false;
    box.innerHTML = `<p class="eyebrow">The scribe</p><h2>What are your orders this season?</h2>
      <p class="voice">“${esc(E.situation(s))} You may give up to ${E.MAX_ORDERS} orders.”</p>
      <div class="desk">
        <div class="col"><h3>Your council's plans</h3><p class="sum" style="margin:0">Add a whole plan, then add or strike out single orders.</p><div class="col" id="plans"></div></div>
        <div class="col"><h3>All actions</h3><div class="groups" id="groups"></div>
          <div style="display:grid;gap:6px;margin-top:6px"><label for="words" class="eyebrow" style="margin:0">Or in your own words</label>
          <textarea id="words" placeholder="Plant olives, hang the brigands and send a convoy to Brundisium to sell 10 wine"></textarea>
          <div class="row"><button class="btn small" type="button" id="read">Give them to the scribe</button></div><div id="answer"></div></div></div>
        <div class="col book" id="bookcol"></div>
      </div>`;
    $("plans").innerHTML = plansNow.map((p, i) => `<div class="plan"><div class="ph">${E.ADVISORS[p.who] ? coin(p.who) : `<span class="mark">${PLAN_MARK[p.who]}</span>`}
        <div><h3>${esc(p.title)}</h3><small>${esc(E.ADVISORS[p.who] ? E.ADVISORS[p.who].name : "the scribe")}</small></div>
        <button class="btn small quiet" type="button" data-plan="${i}">Add</button></div>
        <ul>${p.orders.map((o) => `<li>${esc(E.describe(s, o))}</li>`).join("")}</ul></div>`).join("") || `<p class="sum">No one has a plan the treasury and stores can pay for.</p>`;
    $("plans").querySelectorAll("[data-plan]").forEach((b) => (b.onclick = () => addOrders(plansNow[+b.dataset.plan].orders)));
    $("groups").innerHTML = GROUPS.map(([label, ids]) => `<div class="group"><h4>${label}</h4><div class="acts">${ids.map((id) => {
      const d = E.DECREE[id], c = E.num(d.cost_treasury), mats = E.parseList(d.cost);
      const price = ["build", "send_convoy", "merchants"].includes(id) ? (id === "build" ? "or click a free plot" : id === "merchants" ? "sailing season, up to 20 loads" : "or click a town") : [c ? E.intc(c) : "", ...Object.entries(mats).map(([g, q]) => `${q} ${E.nameOf(g).toLowerCase()}`)].filter(Boolean).join(", ");
      return `<button class="act" type="button" data-act="${id}">${esc(d.name)}${price ? `<small>${esc(price)}</small>` : ""}</button>`; }).join("")}</div></div>`).join("");
    $("groups").querySelectorAll("[data-act]").forEach((b) => (b.onclick = () => {
      const id = b.dataset.act;
      if (id === "build") buildPicker();
      else if (id === "send_convoy") convoyBuilder(selectedTown);
      else if (id === "merchants") merchantBuilder();
      else addOrders([E.order(id)]);
    }));
    $("read").onclick = () => {
      const text = $("words").value.trim(); if (!text) return;
      const res = E.wordParse(s, text);
      $("answer").innerHTML = `<p class="voice" style="font-size:18px">The scribe: “${esc(res.reply)}”</p>`;
      if (res.orders.length) { addOrders(res.orders); $("words").value = ""; }
    };
    renderBook();
  }
  function addOrders(list) {
    const room = E.MAX_ORDERS - book.length;
    if (room <= 0) { toast(`The order book is full: ${E.MAX_ORDERS} orders a season.`); return; }
    book = book.concat(list.slice(0, room).map((o) => JSON.parse(JSON.stringify(o))));
    if (list.length > room) toast(`Only ${room} more order${room > 1 ? "s" : ""} fit this season.`);
    renderBook();
  }
  function renderBook() {
    const [accepted, problems] = E.validate(s, book);
    const t = E.totals(s, accepted);
    const matLine = Object.entries(t.mats).map(([g, q]) => `<span class="${q > s[g] ? "short" : ""}">${q} ${esc(E.nameOf(g).toLowerCase())} <small>(of ${Math.trunc(s[g])})</small></span>`).join(", ");
    $("bookcol").innerHTML = `<h3>The season's orders</h3>
      <div class="slots" role="img" aria-label="${book.length} of ${E.MAX_ORDERS} orders">${Array.from({ length: E.MAX_ORDERS }, (_, i) => `<i class="${i < book.length ? "on" : ""}"></i>`).join("")}</div>
      ${book.length ? `<ol>${book.map((o, i) => { const ok = accepted.includes(o);
        return `<li class="${ok ? "" : "bad"}"><span>${esc(E.describe(s, o))}${ok ? "" : "<em>cannot be done as it stands</em>"}</span><button type="button" data-del="${i}" aria-label="Strike out ${esc(E.describe(s, o))}">×</button></li>`; }).join("")}</ol>`
        : `<p class="sum" style="margin:0">No orders yet. Add a plan or single actions. You can also click a free plot on the city sheet, or a town on the map.</p>`}
      ${problems.length ? `<ul class="problems">${problems.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
      <p class="cost" style="margin:0">Costs <b>${E.intc(t.treasury)}</b> of ${E.intc(s.treasury)} denarii${matLine ? `; ${matLine}` : ""}.${t.loyalty ? ` Loyalty ${t.loyalty > 0 ? "+" : ""}${t.loyalty}.` : ""}${t.favour ? ` Rome ${t.favour > 0 ? "+" : ""}${t.favour}.` : ""}${t.extra.length ? " " + esc(t.extra.join("; ")) + "." : ""}</p>
      <div class="row"><button class="btn" type="button" id="sealit">${accepted.length ? `Seal ${accepted.length} order${accepted.length > 1 ? "s" : ""}` : "Do nothing this season"}</button>
      ${book.length ? `<button class="btn quiet small" type="button" id="clearbook">Clear</button>` : ""}</div>
      ${accepted.length < book.length ? `<p class="sum" style="margin:0">Orders marked red are left out when you seal.</p>` : ""}`;
    $("bookcol").querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => { book.splice(+b.dataset.del, 1); renderBook(); }));
    const clear = $("clearbook"); if (clear) clear.onclick = () => { book = []; renderBook(); };
    $("sealit").onclick = () => seal(accepted);
  }

  function buildPicker(zone) {
    if (phase !== "orders") { toast("Orders are given after the season's cards are read."); return; }
    const base = E.validate(s, book)[0].length;
    const rows = E.BUILDING_LIST.filter((b) => b.id !== "forum" && (!zone || b.zone === zone)).map((b) => {
      const c = E.num(b.cost_treasury), mats = E.parseList(b.cost);
      const [ok, probs] = E.validate(s, book.concat([E.order("build", { building: b.id })]));
      const fits = ok.length === base + 1;
      const n = (k) => E.num(b[k]);
      const time = `${n("seasons_to_build")} season${n("seasons_to_build") !== 1 ? "s" : ""} to build${n("matures") ? `, first yield ${n("matures")} after` : ""}${n("ramp") > 1 ? `, full in ${n("ramp")} more` : ""}`;
      const cost = [c ? E.intc(c) + " den" : "", ...Object.entries(mats).map(([g, q]) => `<span class="${q > s[g] ? "short" : ""}">${q} ${esc(E.nameOf(g).toLowerCase())}</span>`)].filter(Boolean).join(", ");
      return `<button class="pick" type="button" data-b="${b.id}" ${fits ? "" : "disabled"}>${icon(b.id, 38)}<span><span class="t">${esc(b.name)}</span> <span class="d">· ${b.zone === "town" ? "in town" : "in the fields"}</span><br><span class="d">${esc(clean(b.notes))} ${esc(time)}.</span>${fits ? "" : `<br><span class="d short">${esc(probs[probs.length - 1] || "")}</span>`}</span><span class="c">${cost || "free"}</span></button>`;
    }).join("");
    openVeil(`<div class="dialog wide" role="dialog" aria-label="Build or plant"><h2>${zone === "town" ? "Build inside the walls" : zone === "field" ? "Build or plant in the fields" : "Build or plant"}</h2>
      <div class="picklist">${rows}</div><div class="row"><button class="btn quiet" type="button" data-close>Cancel</button></div></div>`);
    $("veil").querySelectorAll("[data-b]").forEach((b) => (b.onclick = () => { addOrders([E.order("build", { building: b.dataset.b })]); closeVeil(); }));
  }

  function convoyBuilder(townId) {
    if (phase !== "orders") { toast("Orders are given after the season's cards are read."); return; }
    let town = townId || E.TOWNS[0].id;
    const draw = () => {
      const t = E.TOWN[town];
      const sellRows = Object.keys(t.buysFrom).map((g) => `<tr><td>${esc(E.nameOf(g))}</td><td>${E.intc(E.priceAt(s, town, g, "sell"))}</td><td>${Math.trunc(s[g] || 0)}</td><td><input type="number" min="0" max="${Math.trunc(s[g] || 0)}" value="0" data-sell="${g}" aria-label="Sell ${esc(E.nameOf(g))}"></td></tr>`).join("");
      const buyRows = Object.keys(t.sellsTo).map((g) => `<tr><td>${esc(E.nameOf(g))}${g === "grain" ? " (months)" : ""}</td><td>${E.intc(E.priceAt(s, town, g, "buy"))}</td><td>${g === "grain" ? s.grain.toFixed(1) : Math.trunc(s[g] || 0)}</td><td><input type="number" min="0" max="40" value="0" data-buy="${g}" aria-label="Buy ${esc(E.nameOf(g))}"></td></tr>`).join("");
      openVeil(`<div class="dialog wide" role="dialog" aria-label="Send a trade convoy"><h2>Send a trade convoy</h2>
        <div class="townpick">${E.TOWNS.map((x) => `<button type="button" data-town="${x.id}" aria-pressed="${x.id === town}">${esc(x.name)}</button>`).join("")}</div>
        <p class="sum" style="margin:0">${esc(t.name)} lies ${t.direction} of us, ${t.days} day${t.days > 1 ? "s" : ""}' sailing; the ship is back ${t.seasons > 1 ? "in two seasons" : "next season"}. The crew costs 100 denarii. When she comes home the d20 is rolled for the voyage (need ${E.VOYAGE_TARGET}): a failure loses half the cargo to a storm, a 1 means pirates.</p>
        <div style="overflow-x:auto"><table class="trade"><thead><tr><th>Sell here</th><th>Price</th><th>In store</th><th>Amount</th></tr></thead><tbody>${sellRows}</tbody></table></div>
        <div style="overflow-x:auto"><table class="trade"><thead><tr><th>Buy here</th><th>Price</th><th>Have</th><th>Amount</th></tr></thead><tbody>${buyRows}</tbody></table></div>
        <div><div class="meter" id="meter"><i style="width:0"></i></div><p class="sum" id="ctot" style="margin:6px 0 0"></p></div>
        <div class="row"><button class="btn" type="button" id="cadd">Add to orders</button><button class="btn quiet" type="button" data-close>Cancel</button></div></div>`);
      $("veil").querySelectorAll("[data-town]").forEach((b) => (b.onclick = () => { town = b.dataset.town; draw(); }));
      const read = () => {
        const o = { id: "send_convoy", town, sell: {}, buy: {}, building: "none" };
        $("veil").querySelectorAll("[data-sell]").forEach((i) => { const v = Math.max(0, parseInt(i.value, 10) || 0); if (v) o.sell[i.dataset.sell] = v; });
        $("veil").querySelectorAll("[data-buy]").forEach((i) => { const v = Math.max(0, parseInt(i.value, 10) || 0); if (v) o.buy[i.dataset.buy] = v; });
        return o;
      };
      const update = () => {
        const o = read(), l = E.loads(o), cost = E.costOf(s, o)[0];
        const income = Object.entries(o.sell).reduce((v, [g, q]) => v + q * E.priceAt(s, town, g, "sell"), 0);
        $("meter").classList.toggle("over", l > E.SHIP_LOAD);
        $("meter").firstElementChild.style.width = Math.min(100, (l / E.SHIP_LOAD) * 100) + "%";
        $("ctot").textContent = `Cargo ${l} of ${E.SHIP_LOAD} loads (a month of grain is ${E.GRAIN_LOAD}). Pay now ${E.intc(cost)} denarii; she brings home about ${E.intc(income)}.`;
      };
      $("veil").querySelectorAll("input").forEach((i) => (i.oninput = update));
      update();
      $("cadd").onclick = () => { const o = read(); if (!E.loads(o)) { $("ctot").textContent = "Choose something to sell or buy."; return; } addOrders([o]); closeVeil(); };
    };
    draw();
  }

  function merchantBuilder() {
    if (phase !== "orders") { toast("Orders are given after the season's cards are read."); return; }
    if (E.seasonOf(s.turn)[0].sailing === "no") { toast("No merchant ships call in winter (mare clausum)."); return; }
    const rows = E.MERCHANT_GOODS.map((g) => `<tr><td>${esc(E.nameOf(g))}${g === "grain" ? " (months)" : ""}</td><td>${E.intc(E.merchantPrice(g))}</td><td>${g === "grain" ? s.grain.toFixed(1) : Math.trunc(s[g] || 0)}</td><td><input type="number" min="0" max="${E.MERCHANT_LOAD}" value="0" data-buy="${g}" aria-label="Buy ${esc(E.nameOf(g))}"></td></tr>`).join("");
    openVeil(`<div class="dialog wide" role="dialog" aria-label="Buy from passing merchants"><h2>Buy from passing merchants</h2>
      <p class="sum" style="margin:0">Greek and Italian ships call at the quay. They sell at half again the base price, but no ship of ours has to sail and nothing is lost at sea: the goods are in the stores at once. Up to ${E.MERCHANT_LOAD} loads a season (a month of grain is ${E.GRAIN_LOAD}). No luxuries.</p>
      <div style="overflow-x:auto"><table class="trade"><thead><tr><th>Buy</th><th>Price</th><th>Have</th><th>Amount</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div><div class="meter" id="meter"><i style="width:0"></i></div><p class="sum" id="ctot" style="margin:6px 0 0"></p></div>
      <div class="row"><button class="btn" type="button" id="cadd">Add to orders</button><button class="btn quiet" type="button" data-close>Cancel</button></div></div>`);
    const read = () => {
      const o = E.order("merchants", { buy: {} });
      $("veil").querySelectorAll("[data-buy]").forEach((i) => { const v = Math.max(0, parseInt(i.value, 10) || 0); if (v) o.buy[i.dataset.buy] = v; });
      return o;
    };
    const update = () => {
      const o = read(), l = E.loads(o);
      $("meter").classList.toggle("over", l > E.MERCHANT_LOAD);
      $("meter").firstElementChild.style.width = Math.min(100, (l / E.MERCHANT_LOAD) * 100) + "%";
      $("ctot").textContent = `${l} of ${E.MERCHANT_LOAD} loads. Costs ${E.intc(E.costOf(s, o)[0])} denarii.`;
    };
    $("veil").querySelectorAll("input").forEach((i) => (i.oninput = update));
    update();
    $("cadd").onclick = () => { const o = read(); if (!E.loads(o)) { $("ctot").textContent = "Choose something to buy."; return; } addOrders([o]); closeVeil(); };
  }

  async function seal(orders) {
    phase = "resolving";
    $("orders").querySelectorAll("button, textarea").forEach((b) => (b.disabled = true));
    const before = s.before;
    const notes = [...(s.season_notes || [])];
    E.updateMoods(s, wants, orders, notes);
    await E.applyDecrees(s, orders, notes);
    await E.resolve(s, notes);
    E.clampAndCheck(s, notes);
    say = {}; book = [];
    const [season, year] = E.seasonOf(s.turn);
    const rows = E.NUMBERS.filter((n) => Math.abs(s[n] - (before[n] || 0)) >= 0.05).map((n) => {
      const d = s[n] - (before[n] || 0);
      return `<tr><td>${esc(E.nameOf(n))}</td><td>${E.fmt(n, before[n] || 0)}</td><td>${E.fmt(n, s[n])}</td><td class="${d > 0 ? "up" : "down"}">${d > 0 ? "+" : "−"}${E.fmt(n, Math.abs(d))}</td></tr>`;
    }).join("");
    const history = (s.season_cards || []).map((id) => D.cards.find((c) => c.id === id)).filter((c) => c && String(c.historical_note || "").trim())
      .map((c) => `History (${c.title}): ${String(c.historical_note).replace(/\s+/g, " ")}`);
    const list = notes.map((t) => `<li>${esc(t)}</li>`).join("") + history.map((t) => `<li class="history">${esc(t)}</li>`).join("");
    const done = s.over;
    s.turn += 1;
    phase = "report";
    refresh(before);
    if (done) store.del(KEY); else save();
    $("stage").innerHTML = `<section class="panel"><p class="eyebrow">${season.season}, AD ${year} · the season ends</p>
      <h2>${done ? "The end of your governorship" : "The scribe's report"}</h2>${done ? `<p class="voice">${esc(done)} You governed for ${s.turn - 1} seasons.</p>` : ""}
      <ul class="notes" style="margin-top:8px">${list || "<li>A quiet season.</li>"}</ul>
      ${rows ? `<div style="overflow-x:auto;margin-top:14px"><table class="changes"><tbody>${rows}</tbody></table></div>` : ""}
      <div class="row" style="margin-top:14px"><button class="btn" type="button" id="next">${done ? "Govern again" : "Next season"}</button></div></section>`;
    $("next").onclick = () => { if (done) { s = E.newGame(); intro(); } else startSeason(); };
    $("stage").scrollIntoView({ behavior: reduce() ? "auto" : "smooth", block: "start" });
  }

  function intro() {
    phase = "intro"; say = {}; book = [];
    refresh();
    $("stage").innerHTML = `<section class="panel"><p class="eyebrow">AD 30 · Acruvium, on the Gulf of Rhizon</p><h2>Tiberius sends you to govern Acruvium</h2>
      <p class="voice">Each turn is one season. Three cards are turned over: the land, the sea and the gods. Your council speaks, and you give up to ${E.MAX_ORDERS} orders: build and plant, trade by sea with the towns of the Adriatic, keep order, honour the gods and the Emperor.</p>
      <p class="sum">Things take time. A harbour takes two years to build and a temple three; vines give their first wine a year after planting. You lose if Roman favour reaches 0, if the town rises while the garrison is under 100 men, or after two hungry seasons in a row. The tribute of ${E.intc(E.TRIBUTE)} denarii falls due each summer.</p>
      <div class="row"><button class="btn" type="button" id="begin">Take up the governorship</button></div></section>`;
    $("begin").onclick = startSeason;
  }

  // ---------- options, new game, boot ----------
  function opts() {
    $("opts").innerHTML = `Sound <button type="button" id="snd" aria-pressed="${sound}">${sound ? "on" : "off"}</button> · Die ` +
      Object.keys(D.dice).map((k) => `<button type="button" data-stone="${k}" aria-pressed="${k === stone}">${k}</button>`).join("");
    $("snd").onclick = () => { sound = !sound; store.set(SOUND_KEY, sound ? "on" : "off"); opts(); if (sound) rustle(); };
    $("opts").querySelectorAll("[data-stone]").forEach((b) => (b.onclick = () => { stone = b.dataset.stone; store.set(STONE_KEY, stone); opts(); cornerDie(); }));
  }
  $("newgame").onclick = () => { store.del(KEY); s = E.newGame(); selectedTown = null; closeVeil(); intro(); };
  opts();
  let saved = null;
  try { saved = JSON.parse(store.get(KEY) || "null"); } catch (e) { saved = null; }
  if (saved && saved.version === 2 && saved.turn && !saved.over) { s = saved; startSeason(); } else { s = E.newGame(); intro(); }
})();
</script>
