<title>Illyria: The Governor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&family=Marcellus&display=swap">
<style>
/* Layout: the table of a board game. The board (city sheet or Adriatic map, in tabs) beside the council;
   below it the season's stage: cards, then the order book, then the report. Compass and die sit in the corners. */
:root {
  color-scheme: dark;
  --night: #0f1430;      /* page ground */
  --dusk: #261b42;       /* panels */
  --wine: #2c0819;       /* inset wells */
  --gold: #e2bd66;       /* accent: lettering, rules, coins */
  --gold-pale: #f6e3a1;
  --ink: #f3e8d2;
  --mute: #b9a98f;
  --crimson: #b8324f;
  --sea-deep: #0b2440;
  --line: rgba(226, 189, 102, .35);
  --faint: rgba(226, 189, 102, .16);
  --good: #9fdcae; --bad: #ff9b9b;
  --land: #6d5a1e; --seacard: #11485a; --omen: #5a1640;
  --f-display: "Caesar Dressing", "Marcellus", Georgia, serif;
  --f-label: "Marcellus", Georgia, "Times New Roman", serif;
  --f-voice: "Marcellus", Georgia, serif;
  --gutter: clamp(16px, 3vw, 32px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: radial-gradient(1200px 700px at 30% -10%, #2a1d4a 0%, var(--night) 60%) fixed, var(--night);
  color: var(--ink); font: 17px/1.5 var(--f-label); padding: 0 var(--gutter); padding-block: 16px 120px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
:focus-visible { outline: 2px solid var(--gold-pale); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 16px; }
h2 { font: 400 clamp(23px, 2.8vw, 29px)/1.15 var(--f-display); color: var(--gold); margin: 0 0 8px; letter-spacing: .03em; text-wrap: balance; }
h3 { font: 400 17px/1.3 var(--f-label); color: var(--gold-pale); margin: 0; letter-spacing: .04em; }
.eyebrow { font-size: 12.5px; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); margin: 0 0 8px; }
.voice { font: 400 19px/1.5 var(--f-voice); color: var(--ink); max-width: 62ch; margin: 0; }
.sum { color: var(--mute); font-size: 15px; font-variant-numeric: tabular-nums; }
.panel { background: rgba(38, 27, 66, .72); border: 1px solid var(--line); border-radius: 16px; padding: 16px clamp(14px, 2.2vw, 22px); min-width: 0; }

/* header and tabs */
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 400 clamp(32px, 4.6vw, 46px)/1 var(--f-display); color: var(--gold); letter-spacing: .04em; }
.brand span { font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold-pale); }
.when { font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.when b { color: var(--gold-pale); font-weight: 400; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.ghost:hover { color: var(--gold-pale); border-color: var(--gold); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { background: none; border: 1px solid transparent; border-bottom: 0; border-radius: 12px 12px 0 0; padding: 8px 16px 7px; color: var(--mute); letter-spacing: .12em; text-transform: uppercase; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
.tab b { font: 400 19px var(--f-display); letter-spacing: .04em; text-transform: none; }
.tab[aria-selected="true"] { color: var(--gold-pale); border-color: var(--line); background: rgba(38, 27, 66, .9); margin-bottom: -1px; }

/* ledger */
.ledger { display: grid; grid-template-columns: repeat(auto-fit, minmax(122px, 1fr)); border: 1px solid var(--line); border-radius: 14px; background: rgba(38, 27, 66, .6); overflow: hidden; }
.num { padding: 9px 14px 10px; border-right: 1px solid var(--faint); display: grid; min-width: 0; }
.num .k { font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }
.num .v { font-size: 25px; color: var(--gold-pale); font-variant-numeric: tabular-nums; line-height: 1.2; }
.num .u { font-size: 12.5px; color: var(--mute); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.up { color: var(--good) !important; } .down { color: var(--bad) !important; }
.num.warn .v { color: var(--bad); }

/* board + council */
.table { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .table { grid-template-columns: minmax(0, 1fr); } }
.board { display: grid; min-width: 0; }
.sheet { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 16px 16px; background: rgba(38, 27, 66, .72); padding: 14px; display: grid; gap: 14px; min-width: 0; }
.mapwrap { overflow: hidden; border-radius: 12px; border: 1px solid var(--faint); background: var(--sea-deep); }
.mapwrap svg { display: block; width: 100%; height: auto; }
.plot-hit, .town-hit { cursor: pointer; }
.plot-hit:hover .plot-frame, .plot-hit:focus-visible .plot-frame { stroke: var(--gold-pale); stroke-width: 3; }
.plot-hit:focus, .town-hit:focus { outline: none; }
#citymap { background: #ecdcb4; border-color: rgba(61, 43, 26, .55); }
#citymap .plot-hit:hover .plot-frame, #citymap .plot-hit:focus-visible .plot-frame { stroke: #a8432f; stroke-width: 3; }
.town-hit:hover .walls, .town-hit:focus-visible .walls { stroke: var(--gold-pale); stroke-width: 3; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--mute); }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.stores { display: grid; gap: 10px; }
.stores-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.good { border: 1px solid var(--faint); border-radius: 10px; padding: 6px 10px; display: grid; min-width: 0; }
.good .n { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.good .q { font-size: 19px; color: var(--gold-pale); font-variant-numeric: tabular-nums; display: flex; gap: 6px; align-items: baseline; }
.good .q small { font-size: 12.5px; }
.good.zero .q { color: rgba(185,169,143,.55); }
.towninfo { display: grid; gap: 8px; }
.fleet { display: grid; gap: 10px; }
.fleet table { width: 100%; border-collapse: collapse; font-size: 14px; }
.fleet td, .fleet th { padding: 5px 6px; border-bottom: 1px solid var(--faint); text-align: left; vertical-align: top; }
.fleet th { font: 400 12px var(--f-label); letter-spacing: 1px; color: var(--mute); text-transform: uppercase; }
.fleet td.n { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.fleet .where { color: var(--gold-pale); }
.fleet .pos { color: var(--good); } .fleet .neg { color: var(--bad); }
.fleet-wrap { overflow-x: auto; }
.inventions { border: 1px solid var(--faint); border-radius: 12px; padding: 8px 12px; font-size: 14px; }
.num.clickable { cursor: pointer; }
.lanes-odds .exposed { color: var(--bad); }
.toast.news { border-color: var(--good); }
.twocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.prices { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.prices td { padding: 4px 6px; border-top: 1px solid var(--faint); }
.prices td:nth-child(2) { text-align: right; }
.prices td:nth-child(3) { color: var(--mute); font-size: 13px; }

/* council */
.council { display: grid; gap: 10px; }
.adv { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 2px 12px; align-items: start; background: none; border: 0; padding: 4px 0; text-align: left; width: 100%; }
.adv + .adv { border-top: 1px solid var(--faint); padding-top: 10px; }
.coinwrap { --d: 64px; position: relative; display: block; flex: none; grid-row: span 3; width: var(--d); height: var(--d); }
.coin { width: var(--d); height: var(--d); border-radius: 50%; overflow: hidden; position: relative; box-shadow: 0 0 0 2px var(--gold), 0 6px 16px rgba(0,0,0,.5); display: block; }
.badge { position: absolute; right: calc(var(--d) * -.12); bottom: calc(var(--d) * -.1); width: calc(var(--d) * .48); height: calc(var(--d) * .48); border-radius: 50%; background: #2c0819; box-shadow: 0 0 0 1.5px var(--gold), 0 3px 8px rgba(0,0,0,.6); display: grid; place-items: center; }
.badge svg { width: 80%; height: 80%; display: block; }
.coin img { position: absolute; width: calc(var(--d) * 1.911); max-width: none; left: calc(var(--d) * -0.4555); top: calc(var(--d) * -0.2643); }
.adv .who { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; align-items: baseline; }
.adv .name { color: var(--gold-pale); font-size: 16px; }
.leaves { display: inline-flex; gap: 3px; }
.leaves i { width: 13px; height: 7px; border-radius: 50%; border: 1.5px solid var(--gold); opacity: .55; }
.leaves i.on { background: var(--gold); opacity: 1; }
.ab { font-size: 12.5px; color: var(--mute); }
.ab b { font-weight: 400; color: var(--gold); } .ab .sulk { color: var(--bad); }
.say { font: 400 15.5px/1.4 var(--f-voice); color: var(--ink); }

/* stage */
.stage { display: grid; gap: 16px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; perspective: 1200px; }
@media (max-width: 600px) { .cards { grid-template-columns: minmax(0, 1fr); } }
.card { position: relative; min-height: 340px; max-width: 100%; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.2, .7, .2, 1); border: 0; padding: 0; background: none; text-align: left; width: 100%; }
@media (max-width: 600px) { .card { min-height: 300px; } }
.card.flip { transform: rotateY(180deg); cursor: default; }
.card > div { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; border: 2px solid var(--gold); overflow: hidden; }
.card .back { background: repeating-linear-gradient(45deg, rgba(226,189,102,.08) 0 10px, transparent 10px 20px), var(--wine); display: grid; place-items: center; align-content: center; gap: 8px; }
.card .back span { font: 400 30px var(--f-display); color: var(--gold); letter-spacing: .1em; }
.card .back em { font: 400 14px var(--f-voice); letter-spacing: .08em; color: var(--mute); }
.card:not(.flip):hover .back { box-shadow: inset 0 0 0 2px var(--gold-pale), 0 0 26px rgba(246,227,161,.25); }
.card.next .back { animation: beckon 1.6s ease-in-out infinite; }
.cards .card:not(.flip):not(.next) .back { filter: brightness(.6); }
.card .eff.done { color: var(--good); letter-spacing: .06em; text-transform: none; font-size: 13.5px; }
@keyframes beckon { 0%, 100% { box-shadow: inset 0 0 0 2px var(--gold), 0 0 6px rgba(246,227,161,.15); } 50% { box-shadow: inset 0 0 0 3px var(--gold-pale), 0 0 28px rgba(246,227,161,.55); } }
.card.active { z-index: 1; }
.card.active > div { animation: chosen 1.4s ease-in-out infinite; }
@keyframes chosen { 0%, 100% { box-shadow: 0 0 0 3px var(--gold-pale), 0 0 18px rgba(246,227,161,.35); } 50% { box-shadow: 0 0 0 4px #fff4c8, 0 0 44px rgba(246,227,161,.75); } }
.cards.deciding .card:not(.active) .face { filter: brightness(.45) saturate(.6); transition: filter .3s; }   /* on the face, not the card: opacity or a filter on the card breaks the 3D flip */
#decide { border-color: var(--gold); box-shadow: 0 0 30px rgba(246,227,161,.18); }
.card .face { transform: rotateY(180deg); background: var(--wine); display: grid; grid-template-rows: auto auto 1fr auto; }
.card .art { height: 96px; border-bottom: 1px solid var(--line); }
.card[data-deck="land"] .art { background: linear-gradient(180deg, rgba(109,90,30,.35), rgba(44,8,25,0)); }
.card[data-deck="sea"] .art { background: linear-gradient(180deg, rgba(17,72,90,.45), rgba(44,8,25,0)); }
.card[data-deck="omen"] .art { background: linear-gradient(180deg, rgba(90,22,64,.5), rgba(44,8,25,0)); }
.card .art svg { width: 100%; height: 100%; display: block; }
.card .band { padding: 7px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--gold-pale); }
.card[data-deck="land"] .band { background: var(--land); } .card[data-deck="sea"] .band { background: var(--seacard); } .card[data-deck="omen"] .band { background: var(--omen); }
.card .band svg { width: 22px; height: 22px; }
.card .body { padding: 10px 14px; display: grid; align-content: start; gap: 6px; min-width: 0; }
.card .title { font-size: 19px; line-height: 1.25; color: var(--gold-pale); text-wrap: balance; }
.card .hint { font: 400 15px/1.4 var(--f-voice); color: var(--mute); }
.card .eff { padding: 8px 14px; border-top: 1px solid var(--line); font-size: 14px; }
.card .eff.decide { color: var(--gold); letter-spacing: .14em; text-transform: uppercase; font-size: 12.5px; }
.card.quiet .face { opacity: .8; }
.choice { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; align-items: start; text-align: left; width: 100%; background: rgba(44, 8, 25, .7); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.opt:hover:not(:disabled) { border-color: var(--gold); background: rgba(70, 18, 44, .85); }
.opt .key { grid-row: span 2; font: 400 24px/1 var(--f-display); color: var(--gold); min-width: 1.3em; }
.opt .what { color: var(--gold-pale); }
.opt .sub { font-size: 14px; color: var(--mute); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { background: linear-gradient(180deg, #f0d184, #c9993d); color: #2c0819; border: 0; border-radius: 999px; padding: 9px 22px; font-size: 14.5px; letter-spacing: .14em; text-transform: uppercase; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn.quiet { background: none; color: var(--gold-pale); border: 1px solid var(--line); }
.btn.small { padding: 5px 14px; font-size: 12.5px; }
.problems { margin: 0; padding-left: 20px; color: var(--bad); font-size: 14.5px; }
.book .problems li { display: list-item; border: 0; padding: 0; counter-increment: none; }
.book .problems li::before { content: none; }

/* a card's decision: two advisors' proposals, your own order, or let it be */
.advice { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; margin-top: 12px; }
.prop { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: start; text-align: left; width: 100%; background: rgba(44, 8, 25, .7); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px 14px 12px; }
.prop:hover:not(:disabled), .prop:focus-visible { border-color: var(--gold); background: rgba(70, 18, 44, .85); }
.prop .coinwrap { --d: 56px; }
.prop .who { color: var(--gold-pale); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.tag { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; padding: 1px 9px; border-radius: 999px; border: 1px solid currentColor; }
.tag.moderate { color: var(--good); } .tag.risky { color: #ffb36b; }
.prop .say { font: 400 15.5px/1.45 var(--f-voice); color: var(--ink); }
.prop .what { display: flex; align-items: center; gap: 8px; color: var(--gold-pale); font-size: 14.5px; }
.prop .what small { color: var(--mute); }
.own { display: grid; gap: 6px; margin-top: 14px; }
.own .row { gap: 8px; }
.review { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 10px; }
.review > div { border: 1px solid var(--faint); border-radius: 12px; padding: 10px 14px; }
.review h3 { margin-bottom: 6px; }
.review ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 15px; }
.review .wins h3 { color: var(--good); } .review .woes h3 { color: var(--bad); }
.desk.one { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
@media (max-width: 760px) { .desk.one { grid-template-columns: minmax(0, 1fr); } }

/* order desk */
.desk { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 14px; }
@media (max-width: 1100px) { .desk { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .desk .book { grid-column: 1 / -1; } }
@media (max-width: 680px) { .desk { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 10px; min-width: 0; align-content: start; }
.plan { border: 1px solid var(--faint); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; background: rgba(44, 8, 25, .45); }
.plan .ph { display: flex; align-items: center; gap: 10px; }
.plan .ph .coinwrap { --d: 38px; } .plan .ph .coin { box-shadow: 0 0 0 1.5px var(--gold); }
.plan .ph .mark { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--gold); display: grid; place-items: center; font: 400 17px var(--f-display); color: var(--gold); flex: none; }
.plan .ph div { min-width: 0; flex: 1; }
.plan .ph small { display: block; font-size: 12px; color: var(--mute); letter-spacing: .1em; text-transform: uppercase; }
.plan ul { margin: 0; padding: 0; list-style: none; font-size: 14.5px; display: grid; gap: 3px; }
.plan label { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 2px 4px; border-radius: 8px; }
.plan label:hover { background: rgba(226, 189, 102, .08); }
.plan input[type=checkbox] { accent-color: var(--gold); width: 17px; height: 17px; flex: none; margin: 0; }
.plan label:has(input:not(:checked)) span { color: var(--mute); text-decoration: line-through; }
.groups { display: grid; gap: 10px; }
.group h4 { margin: 0 0 6px; font: 400 12px var(--f-label); letter-spacing: .22em; text-transform: uppercase; color: var(--mute); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.act { background: rgba(44, 8, 25, .6); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 6px; font-size: 14px; color: var(--gold-pale); text-align: left; display: inline-flex; align-items: center; gap: 6px; }
.act small { display: inline; }
.act:hover { border-color: var(--gold); background: rgba(70, 18, 44, .85); }
.act small { color: var(--mute); margin-left: 6px; font-size: 12px; }
textarea, input[type=number], select { background: var(--wine); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: 15.5px var(--f-label); max-width: 100%; }
textarea { width: 100%; min-height: 64px; resize: vertical; }
.book ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; counter-reset: o; }
.book li { counter-increment: o; display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 10px; border: 1px solid var(--faint); border-radius: 10px; font-size: 14.5px; }
.book li::before { content: counter(o, upper-roman); font: 400 15px var(--f-display); color: var(--gold); min-width: 2.1em; }
.book li.bad { border-color: var(--bad); }
.book li em { color: var(--bad); font-style: normal; display: block; font-size: 13px; }
.book li button { background: none; border: 0; color: var(--mute); font-size: 18px; line-height: 1; padding: 0 4px; }
.book li button:hover { color: var(--bad); }
.slots { display: flex; gap: 3px; flex-wrap: wrap; }
.slots i { width: 14px; height: 6px; border-radius: 3px; background: var(--faint); }
.slots i.on { background: var(--gold); }
.cost { font-size: 14px; color: var(--mute); font-variant-numeric: tabular-nums; }
.cost b { color: var(--gold-pale); font-weight: 400; }
.short { color: var(--bad) !important; }

/* report */
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
.notes li { padding-left: 18px; position: relative; max-width: 78ch; }
.notes li::before { content: "◆"; position: absolute; left: 0; top: .1em; font-size: 10px; color: var(--gold); }
.notes li.history { font: 400 16px/1.5 var(--f-voice); color: var(--mute); }
.changes { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
.changes td { padding: 4px 8px; border-bottom: 1px solid var(--faint); }
.changes td:nth-child(n+2) { text-align: right; }

/* overlay */
.veil { position: fixed; inset: 0; background: rgba(6, 5, 16, .78); display: grid; place-items: center; padding: 20px; z-index: 20; backdrop-filter: blur(3px); }
.dialog { width: min(600px, 100%); max-height: calc(100% - 20px); overflow: auto; background: linear-gradient(180deg, #1b1a3e, #2c1c48); border: 2px solid var(--gold); border-radius: 18px; padding: 20px; display: grid; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.dialog.wide { width: min(780px, 100%); }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.kpis.goods { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.kpi { border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px 8px; background: rgba(44, 8, 25, .55); display: grid; gap: 1px; min-width: 0; }

<script>
(function () {
  const E = window.Engine, D = window.GAME_DATA;

    const a = audio(); if (!a) return;
    [0, .09, .2].forEach((t0, k) => {
      const n = noise(a, .32), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + t0;
      f.type = "bandpass"; f.frequency.value = 1800 + k * 900; f.Q.value = .8;

      const lit = !calm && g === a, north = g === 0;

    const letters = [["N", 0], ["E", 90], ["S", 180], ["W", 270]].map(([t, g]) => { const [x, y] = pt(35, g).split(",").map(Number);

    const arc = (r, g, span) => `M${pt(r, g - span)} A${r},${r} 0 0 1 ${pt(r, g + span)}`;
    const gust = calm ? `<circle r="10" fill="none" stroke="#f6e3a1" stroke-width=".8" stroke-dasharray="1.5 2.5"/>`
      : `<path d="${arc(45.5, a, 22)}" fill="none" stroke="#fff4c8" stroke-width="2.6" stroke-linecap="round" filter="url(#rglow)"/>
         <g transform="rotate(${a})" fill="none" stroke="#fff4c8" stroke-linecap="round" opacity=".9">

    return `<svg class="${cls}" viewBox="-52 -52 104 104" aria-hidden="true"><defs><filter id="rglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

  function save() { store.set(KEY, JSON.stringify(s)); }
  async function startSeason() {
    phase = "cards";

    say = {}; book = [];
    refresh();
    const [season, year] = E.seasonOf(s.turn);
    $("cardsbar").innerHTML = `<section class="panel"><p class="eyebrow">${season.season}, AD ${year} · the season's cards</p>
      <h2>Three cards: the land, the sea and the gods</h2><p class="sum" id="cardhint" style="margin:0 0 10px"></p><div class="cards" id="cards"></div></section>

    if (s.cards_turn !== s.turn) {
      s.before = Object.fromEntries(E.NUMBERS.map((n) => [n, s[n]]));
      const notes = [];
      const cards = await E.playCards(s, notes);
      phase = "battle";
      const fought = await E.conflictPhase(s, notes);
      phase = "cards";
      if (fought !== null) { warIdle(); }
      showNews();
      s.season_cards = cards.map((c) => c.id);
      s.season_notes = notes;
      s.cards_turn = s.turn;
      save();

      const cards = (s.season_cards || []).map((id) => D.cards.find((c) => c.id === id)).filter(Boolean);
      $("cards").innerHTML = cards.map((c, i) => cardHTML(c, i, true)).join("");
      $("cardhint").textContent = "This season's cards, already dealt with.";
    }
    $("cardhint").textContent = "The three cards are dealt with. One order of your own, below, then the season ends.";

  /** Every action, for those who want them all: grouped, in a dialog. */

  // ---------- the scribe: Claude when the page may ask, else the word matcher ----------

  async function askScribe(text, context) {

{"id": decree id, "building": a BUILDINGS id (only for build), "town": a TOWNS id (only for send_convoy), "sell": {good: amount} and "buy": {good: amount} (only for send_convoy; for merchants only "buy"; grain is counted in months), "tribe": "docleatae" | "ardiaei" | "pirustae" (only for treat_tribe and march_tribe)}.

${E.rulesText(s)}
TOWN:
${E.stateText(s)}
${context ? "NOW: " + context + "\n" : ""}THE GOVERNOR SAYS: ${text}

  /** The season's numbers as cards: the value, the change with an arrow, and a sparkline of the last seasons. */
  function sparkSVG(n, now) {
    const pts = (s.history || []).map((h) => [h.turn, h[n]]).filter(([, v]) => typeof v === "number");
    if (!pts.length || pts[pts.length - 1][1] !== Math.round(now * 10) / 10) pts.push([s.turn - 1, Math.round(now * 10) / 10]);
    if (pts.length < 2) return "";
    const vs = pts.map(([, v]) => v), lo = Math.min(...vs), hi = Math.max(...vs), W = 120, H = 24;
    const xy = pts.map(([, v], i) => [i / (pts.length - 1) * W, H - (hi === lo ? H / 2 : (v - lo) / (hi - lo) * H)]);
    const [lx, ly] = xy[xy.length - 1];
    return `<svg viewBox="-3 -3 ${W + 6} ${H + 6}" preserveAspectRatio="none" aria-hidden="true"><path d="M${xy.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join("L")}" fill="none" stroke="#e2bd66" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${lx}" cy="${ly}" r="3" fill="#f6e3a1"/></svg>`;
  }
  function kpiHTML(n, before, warnIf) {
    const v = s[n], d = v - (before[n] || 0), unit = n === "grain" ? "months" : n === "loyalty" || n === "favour" ? "/100" : "";
    const pts = (s.history || []).map((h) => `${E.seasonOf(h.turn)[0].season} AD ${E.seasonOf(h.turn)[1]}: ${E.fmt(n, h[n] ?? 0)}`).join("\n");
    const flat = Math.abs(d) < .05, sign = flat ? "· no change" : `${d > 0 ? "▲ +" : "▼ −"}${E.fmt(n, Math.abs(d))}`;
    return `<div class="kpi${warnIf ? " warn" : ""}" title="${esc(E.nameOf(n))}${pts ? "\n" + esc(pts) : ""}"><span class="k">${esc(E.nameOf(n))}</span><span class="v">${E.fmt(n, v)}${unit ? `<small>${unit}</small>` : ""}</span>
      <span class="d ${flat ? "flat" : d > 0 ? "up" : "down"}">${sign}</span>${sparkSVG(n, v)}</div>`;
  }
  function dashboardHTML(before) {
    const core = E.CORE.map((n) => kpiHTML(n, before, (n === "grain" && s.grain < 3) || (n === "loyalty" && s.loyalty < E.REBELLION_BELOW + 5) || (n === "favour" && s.favour < 30))).join("");
    const goods = E.GOODS.filter((g) => s[g] > 0 || Math.abs(s[g] - (before[g] || 0)) >= 1).map((g) => kpiHTML(g, before, false)).join("");
    return `<p class="eyebrow" style="margin:6px 0 6px">The season in numbers</p><div class="kpis">${core}</div>
      ${goods ? `<p class="eyebrow" style="margin:12px 0 6px">The stores</p><div class="kpis goods">${goods}</div>` : ""}`;
  }
  /** After the report: the haruspex's reading, and what the inventions brought, as pop-ups. */
  async function afterSeason(turn) {
    const pr = s.prophecy;
    if (pr && pr.turn === turn) {
      gong();
      modal(figureHTML("priest", `The liver speaks: ${pr.title}`, `“${esc(pr.signs[0])}”`, `<p style="margin:0"><b style="font-weight:400;color:var(--gold-pale)">His advice:</b> ${esc(pr.advice.say)}</p>
        <p class="sum" style="margin:0">The gods speak only once a year. Do as he says within the year: loyalty +2 and Roman favour +2, besides what the order itself brings.</p>
        <div class="row"><button class="btn" type="button" data-i="1">Do as he says</button><button class="btn quiet" type="button" data-i="0">I will think about it</button></div>`));
      const yes = await waitPick($("veil"));
      unmodal();
      if (yes === 1) { s.heed = pr.advice.order; save(); }
    }
    const inv = s.inv_report || [], made = inv.filter((x) => x.good);
    if (made.length) {
      const price = (g) => E.num((D.goods.find((x) => x.id === g) || {}).price);
      const lines = inv.map((x) => x.good ? `${x.name} brings us <b style="font-weight:400;color:var(--gold-pale)">${x.extra} more ${esc(x.unit)} of ${esc(E.nameOf(x.good).toLowerCase())}</b> this season: ${x.base + x.extra} instead of ${x.base}, worth about ${E.intc(x.extra * price(x.good))} denarii at market.`
        : `${x.name} brings <b style="font-weight:400;color:var(--gold-pale)">${E.intc(x.rent)} denarii</b> ${esc(x.text)}.`);
      await advisorSpeaks("economist", "What the machines brought", "", `<ul class="signs">${lines.map((t) => `<li>${t}</li>`).join("")}</ul>`, "Excellent");
    } else if (inv.length) bigNotice({ aid: "economist", title: "What the machines brought", html: `<ul class="signs">${inv.map((x) => `<li>${esc(x.name)} brings <b style="font-weight:400;color:var(--gold-pale)">${E.intc(x.rent)} denarii</b> ${esc(x.text)}.</li>`).join("")}</ul>`, btn: "Excellent" });
  }

  const DIE_LABEL = { opal: "opal", aquamarine: "aquamarine", onyx: "onyx" };
  /** A check, shown before you choose: the twenty faces coloured by what they mean, the chance, the DC and every bonus by name. */
  function checkHTML(ch) {
    if (!ch) return "";
    const need = ch.dc - ch.bonus;
    const seg = Array.from({ length: 20 }, (_, k) => { const f = k + 1, t = f === 1 ? "disaster" : f === 20 ? "triumph" : f >= need ? "success" : "setback"; return `<i class="t-${t}" title="${f}: ${t}"></i>`; }).join("");
    const parts = ch.parts.length ? ch.parts.map(([l, v]) => `${esc(l)} ${v > 0 ? "+" : "−"}${Math.abs(v)}`).join(" · ") : "no bonus";
    return `<span class="check"><span class="strip" aria-hidden="true">${seg}</span>
      <span class="odds"><b>${ch.chance}%</b> <span class="die-name">${esc(DIE_LABEL[ch.die] || ch.die)}</span> d20 ${ch.bonus >= 0 ? "+" : "−"} ${Math.abs(ch.bonus)} against DC ${ch.dc}</span>
      <span>${parts}</span><span class="stakes">Success: ${esc(ch.win)}. Setback: ${esc(ch.lose)}. A 1 is a disaster, a 20 a triumph.</span></span>`;
  }
  function scoreHTML() {
    const sc = E.score(s);
    return `<p class="eyebrow" style="margin:14px 0 4px">What your successor finds</p><table class="score"><tbody>${sc.parts.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join("")}
      <tr class="total"><td>Score</td><td>${sc.total}</td></tr></tbody></table>`;
  }
  function intro() {
    phase = "intro"; say = {}; book = [];
    refresh();
    $("stage").innerHTML = "";
    $("cardsbar").innerHTML = `<section class="panel"><p class="eyebrow">AD 30 · Acruvium, on the Gulf of Rhizon</p><h2>Tiberius sends you to govern Acruvium</h2>
      <p class="voice">Each turn is one season. Three cards are turned over one by one: the land, the sea and the gods. On each card two of your council propose what to do, one cautious and one bold, and you see the odds of each before you choose. When all three are decided, three dice are thrown together: opal for the land, aquamarine for the sea, onyx for the gods. Then one more order of your own, to make good the losses or make the most of a success.</p>
      <p class="voice" style="margin-top:8px"><b style="font-weight:400;color:var(--gold-pale)">Four paths to victory</b> (see the Glory tab): be proclaimed Caesar when an Emperor dies, rule all Illyria by the sword, raise a wonder and be hailed a living god, or fill the chest with 100,000 denarii and buy the coast. Or simply govern well until AD 42.</p>
      <p class="voice" style="margin-top:8px">Letters from Rome arrive on their true dates: the fall of Sejanus, the death of Tiberius, Caligula, Claudius. Beyond your fields live the Illyrian tribes; their land can be won with gifts or with the sword. Your governorship ends in the winter of AD 42.</p>
      <p class="sum">Feed the people first: a town at peace grows every season, and more people pay more taxes. Things take time. A harbour takes two years to build and a temple three; vines give their first wine a year after planting. You lose if Roman favour reaches 0, if the town rises while the garrison is under 100 men, or after two hungry seasons in a row. The tribute of ${E.intc(E.TRIBUTE)} denarii falls due each summer.</p>
      <div class="row"><button class="btn" type="button" id="begin">Take up the governorship</button></div></section>`;
    $("begin").onclick = startSeason;
  }

  // ---------- options, new game, boot ----------
  function opts() {
    $("opts").innerHTML = `Sound <button type="button" id="snd" aria-pressed="${sound}">${sound ? "on" : "off"}</button> · Die for ships and battles ` +
      ["obsidian", "amber", "malachite"].filter((k) => D.dice[k]).map((k) => `<button type="button" data-stone="${k}" aria-pressed="${k === stone}">${k}</button>`).join("");
    $("snd").onclick = () => { sound = !sound; store.set(SOUND_KEY, sound ? "on" : "off"); opts(); if (sound) rustle(); };
    $("opts").querySelectorAll("[data-stone]").forEach((b) => (b.onclick = () => { stone = b.dataset.stone; store.set(STONE_KEY, stone); opts(); cornerDie(); }));
  }
  $("newgame").onclick = () => { store.del(KEY); s = E.newGame(); selectedTown = null; closeVeil(); intro(); };
  opts();
  let saved = null;
  try { saved = JSON.parse(store.get(KEY) || "null"); } catch (e) { saved = null; }
  if (saved && saved.version === 4 && saved.turn && !saved.over) { s = E.migrate(saved); startSeason(); } else { s = E.newGame(); intro(); }
})();
</script>
