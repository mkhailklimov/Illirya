<title>Illyria: The Governor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&family=Cormorant+Garamond:ital,wght@1,500&family=Marcellus&display=swap">
<style>
/* Layout: a governor's desk at night. Ledger of the nine numbers across the top, the season's
   stage (cards, then orders, then the report) in the middle, the council and the city beside it. */
:root {
  color-scheme: dark;
  --night: #0f1430;      /* page ground, the night sky of the kit */
  --dusk: #261b42;       /* raised panels */
  --wine: #2c0819;       /* inset wells: ability box, card faces */
  --gold: #e2bd66;       /* the accent: lettering, rules, coins */
  --gold-pale: #f6e3a1;
  --ink: #f3e8d2;        /* running text */
  --mute: #b9a98f;       /* secondary text */
  --crimson: #b8324f;
  --line: rgba(226, 189, 102, .35);
  --good: #9fdcae;
  --bad: #ff9b9b;
  --land: #6d5a1e; --sea: #11485a; --omen: #5a1640;
  --f-display: "Caesar Dressing", "Marcellus", Georgia, serif;
  --f-label: "Marcellus", Georgia, "Times New Roman", serif;
  --f-voice: "Cormorant Garamond", Georgia, serif;
  --gutter: clamp(16px, 3vw, 32px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: radial-gradient(1200px 700px at 30% -10%, #2a1d4a 0%, var(--night) 60%) fixed, var(--night);
  color: var(--ink); font: 17px/1.5 var(--f-label); padding: 0 var(--gutter); padding-block: 18px 40px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--gold-pale); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }

/* header */
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 400 clamp(34px, 5vw, 48px)/1 var(--f-display); color: var(--gold); letter-spacing: .04em; }
.brand span { font-size: 14px; letter-spacing: .32em; text-transform: uppercase; color: var(--gold-pale); }
.when { font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.when b { color: var(--gold-pale); font-weight: 400; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.ghost:hover { color: var(--gold-pale); border-color: var(--gold); }

/* ledger */
.ledger { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); border: 1px solid var(--line); border-radius: 14px; background: rgba(38, 27, 66, .6); overflow: hidden; }
.num { padding: 10px 14px 12px; border-right: 1px solid rgba(226, 189, 102, .15); display: grid; gap: 1px; min-width: 0; }
.num .k { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }
.num .v { font-size: 26px; color: var(--gold-pale); font-variant-numeric: tabular-nums; line-height: 1.15; }
.num .u { font-size: 12.5px; color: var(--mute); display: flex; gap: 8px; align-items: baseline; }
.num .d { font-variant-numeric: tabular-nums; }
.num .d.up { color: var(--good); } .num .d.down { color: var(--bad); }
.num.warn .v { color: var(--bad); }

/* main grid */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
@media (max-width: 920px) { .main { grid-template-columns: minmax(0, 1fr); } }
.panel { background: rgba(38, 27, 66, .72); border: 1px solid var(--line); border-radius: 16px; padding: 18px clamp(14px, 2.4vw, 24px); min-width: 0; }
.eyebrow { font-size: 12.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); margin: 0 0 10px; }
h2 { font: 400 clamp(24px, 3vw, 30px)/1.15 var(--f-display); color: var(--gold); margin: 0 0 8px; letter-spacing: .03em; text-wrap: balance; }
.voice { font: italic 500 21px/1.4 var(--f-voice); color: var(--ink); max-width: 62ch; }
.stage { display: grid; gap: 18px; }

/* season cards */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; perspective: 1200px; }
@media (max-width: 560px) { .cards { grid-template-columns: minmax(0, 1fr); } }
.card { position: relative; min-height: 250px; max-width: 100%; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.2, .7, .2, 1); }
@media (max-width: 560px) { .card { min-height: 200px; } }
.card.flip { transform: rotateY(180deg); }
.card > div { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; border: 2px solid var(--gold); overflow: hidden; }
.card .back { background: repeating-linear-gradient(45deg, rgba(226,189,102,.08) 0 10px, transparent 10px 20px), var(--wine); display: grid; place-items: center; }
.card .back span { font: 400 28px var(--f-display); color: var(--gold); letter-spacing: .08em; }
.card .face { transform: rotateY(180deg); background: var(--wine); display: grid; grid-template-rows: auto 1fr auto; }
.card .band { padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; letter-spacing: .26em; text-transform: uppercase; color: var(--gold-pale); }
.card[data-deck="land"] .band { background: var(--land); } .card[data-deck="sea"] .band { background: var(--sea); } .card[data-deck="omen"] .band { background: var(--omen); }
.card .band svg { width: 22px; height: 22px; }
.card .body { padding: 12px 14px; display: grid; align-content: start; gap: 8px; min-width: 0; }
.card .title { font-size: 19px; line-height: 1.25; color: var(--gold-pale); text-wrap: balance; }
.card .hint { font: italic 500 16.5px/1.35 var(--f-voice); color: var(--mute); }
.card .eff { padding: 9px 14px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink); }
.card .eff.decide { color: var(--gold); letter-spacing: .14em; text-transform: uppercase; font-size: 12.5px; }
.card.quiet .face { opacity: .78; }
.card.active > div { box-shadow: 0 0 0 3px var(--gold-pale), 0 0 30px rgba(246, 227, 161, .35); }

/* choices and orders */
.choice { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: start; text-align: left; width: 100%; background: rgba(44, 8, 25, .7); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; transition: border-color .2s, background .2s; }
.opt:hover { border-color: var(--gold); background: rgba(70, 18, 44, .85); }
.opt .key { grid-row: span 2; font: 400 26px/1 var(--f-display); color: var(--gold); min-width: 1.4em; }
.opt .what { color: var(--gold-pale); }
.opt .sub { font-size: 14px; color: var(--mute); }
.opt.die .sub::before { content: "⬡ "; color: var(--gold); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { background: linear-gradient(180deg, #f0d184, #c9993d); color: #2c0819; border: 0; border-radius: 999px; padding: 9px 22px; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; }
.btn:hover { filter: brightness(1.08); }
.btn.quiet { background: none; color: var(--gold-pale); border: 1px solid var(--line); }
.problems { margin: 0; padding-left: 20px; color: var(--bad); font-size: 15px; }
textarea, input[type=number], select { background: var(--wine); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font: 16px var(--f-label); }
textarea { width: 100%; min-height: 76px; resize: vertical; }
.decrees { display: grid; gap: 6px; }
.decree { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; border: 1px solid rgba(226,189,102,.18); border-radius: 10px; }
.decree.on { border-color: var(--gold); background: rgba(70, 18, 44, .6); }
.decree .cost { font-size: 14px; color: var(--mute); font-variant-numeric: tabular-nums; white-space: nowrap; }
.decree .extra { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.decree .extra:empty { display: none; }
input[type=checkbox] { accent-color: #d9ac4f; width: 18px; height: 18px; }

/* report */
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.notes li { padding-left: 18px; position: relative; max-width: 72ch; }
.notes li::before { content: "◆"; position: absolute; left: 0; top: .1em; font-size: 10px; color: var(--gold); }
.notes li.history { font: italic 500 18px/1.4 var(--f-voice); color: var(--mute); }
.changes { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
.changes td { padding: 5px 8px; border-bottom: 1px solid rgba(226,189,102,.14); }
.changes td:nth-child(n+2) { text-align: right; }
.changes .up { color: var(--good); } .changes .down { color: var(--bad); }

/* council */
.council { display: grid; gap: 12px; }
.adv { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 4px 14px; align-items: start; background: none; border: 0; padding: 6px 0; text-align: left; width: 100%; }
.adv + .adv { border-top: 1px solid rgba(226,189,102,.14); padding-top: 12px; }
.coin { --d: 74px; width: var(--d); height: var(--d); border-radius: 50%; overflow: hidden; position: relative; grid-row: span 3; box-shadow: 0 0 0 2px var(--gold), 0 6px 16px rgba(0,0,0,.5); }
.coin img { position: absolute; width: calc(var(--d) * 1.911); max-width: none; left: calc(var(--d) * -0.4555); top: calc(var(--d) * -0.2643); }
.adv .who { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; align-items: baseline; }
.adv .name { color: var(--gold-pale); font-size: 16.5px; }
.adv .role { font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }
.leaves { display: inline-flex; gap: 3px; }
.leaves i { width: 13px; height: 7px; border-radius: 50%; border: 1.5px solid var(--gold); opacity: .55; }
.leaves i.on { background: var(--gold); opacity: 1; }
.ab { font-size: 12.5px; color: var(--mute); }
.ab b { font-weight: 400; color: var(--gold); } .ab .sulk { color: var(--bad); }
.say { font: italic 500 17.5px/1.35 var(--f-voice); color: var(--ink); }
.adv.speaks .say::before { content: "“"; } .adv.speaks .say::after { content: "”"; }

/* aside */
aside { display: grid; gap: 18px; min-width: 0; }
.wind img { width: 100%; border-radius: 12px; display: block; }
.wind p { margin: 8px 0 0; font-size: 14.5px; color: var(--mute); }
.city { display: grid; gap: 12px; }
.plots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.plot { border: 1px solid rgba(226,189,102,.3); border-radius: 7px; padding: 5px 4px; text-align: center; font-size: 12.5px; color: var(--gold-pale); background: rgba(44, 8, 25, .6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plot.empty { color: rgba(185,169,143,.45); border-style: dashed; background: none; }
.plot.wip { color: var(--mute); border-style: dashed; }
.zone-h { display: flex; justify-content: space-between; font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
.fleet { font-size: 14.5px; color: var(--mute); margin: 0; }

/* overlay: dice, advisor offers, questions, card viewer */
.veil { position: fixed; inset: 0; background: rgba(6, 5, 16, .78); display: grid; place-items: center; padding: 20px; z-index: 10; backdrop-filter: blur(3px); }
.dialog { width: min(560px, 100%); max-height: calc(100% - 20px); overflow: auto; background: linear-gradient(180deg, #1b1a3e, #2c1c48); border: 2px solid var(--gold); border-radius: 18px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.dialog .head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.dialog .head .coin { --d: 84px; grid-row: auto; }
.dialog .ability { font: 400 24px/1.1 var(--f-display); color: var(--gold); }
.dialog .uses { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--mute); }
.die-stage { display: grid; justify-items: center; gap: 10px; text-align: center; }
.die-stage .die { width: min(240px, 60vw); }
.die-stage .die svg { width: 100%; height: auto; display: block; }
.die-stage.spin .die { animation: tumble .12s linear infinite; }
@keyframes tumble { 0% { transform: rotate(-14deg) scale(.94); } 50% { transform: rotate(10deg) scale(1.03); } 100% { transform: rotate(-14deg) scale(.94); } }
.verdict { font: 400 30px var(--f-display); color: var(--gold); min-height: 1.2em; }
.verdict.bad { color: var(--bad); }
.sum { font-variant-numeric: tabular-nums; color: var(--mute); }
.fullcard { width: min(420px, 100%); border-radius: 18px; display: block; }
footer { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; color: var(--mute); font-size: 13.5px; }
footer .stones { display: flex; gap: 6px; align-items: center; }
footer .stones button { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; color: var(--mute); }
footer .stones button[aria-pressed="true"] { color: var(--gold-pale); border-color: var(--gold); }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .die-stage.spin .die { animation: none; } }
</style>

<div class="wrap">
  <header>
    <div class="brand"><h1>Illyria</h1><span>AD 30 · The Governor</span></div>
    <div class="when"><span id="when"></span><button class="ghost" id="newgame" type="button">New game</button></div>
  </header>
  <section class="ledger" id="ledger" aria-label="The town's numbers"></section>
  <div class="main">
    <div class="stage" id="stage"></div>
    <aside>
      <section class="panel"><p class="eyebrow">Your council</p><div class="council" id="council"></div></section>
      <section class="panel wind" id="wind"></section>
      <section class="panel city" id="city"></section>
    </aside>
  </div>
  <footer>
    <span>Phase 0 playtest · the same rules as <code>rules/play.py</code> · DRAFT numbers</span>
    <span class="stones" id="stones">Die: </span>
  </footer>
</div>
<div class="veil" id="veil" hidden></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  const E = window.Engine, D = window.GAME_DATA;
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const KEY = "illyria-web-save", STONE_KEY = "illyria-die";
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
  let s = null, wants = {}, say = {}, stone = store.get(STONE_KEY) || "obsidian";
  if (!D.dice[stone]) stone = "obsidian";

  // ---------- ledger, council, wind, city ----------
  function ledger(before) {
    $("ledger").innerHTML = E.NUMBERS.map((n) => {
      const r = E.RULES[n], v = s[n], d = before ? v - before[n] : 0;
      const warn = (n === "grain" && v < 3) || ((n === "loyalty" || n === "favour") && v < 30);
      const delta = Math.abs(d) >= 0.05 ? `<span class="d ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : "−"}${E.fmt(n, Math.abs(d))}</span>` : "";
      const unit = n === "loyalty" || n === "favour" ? "of 100" : r.unit;
      return `<div class="num${warn ? " warn" : ""}"><span class="k">${esc(r.name)}</span><span class="v">${E.fmt(n, v)}</span><span class="u">${esc(unit)} ${delta}</span></div>`;
    }).join("");
    const [season, year] = E.seasonOf(s.turn);
    $("when").innerHTML = `Turn <b>${s.turn}</b> · <b>${season.season}, AD ${year}</b> · taxes <b>${s.tax}</b>`;
  }
  const coin = (aid) => `<span class="coin"><img src="img/advisor-${aid}.webp" alt=""></span>`;
  function councilView() {
    $("council").innerHTML = E.COUNCIL_ORDER.map((aid) => {
      const a = E.ADVISORS[aid], st = s.council[aid], state = E.abilityState(s, aid);
      const leaves = Array.from({ length: E.MOOD_MAX }, (_, i) => `<i class="${i < st.mood ? "on" : ""}"></i>`).join("");
      const line = say[aid] ? `<span class="say">${esc(say[aid])}</span>` : `<span class="say">${esc(a.voice)}</span>`;
      return `<button class="adv${say[aid] ? " speaks" : ""}" type="button" data-aid="${aid}" aria-label="Show ${esc(a.name)}'s card">${coin(aid)}
        <span class="who"><span class="name">${esc(a.name)}</span><span class="leaves" title="Mood ${st.mood} of ${E.MOOD_MAX}">${leaves}</span></span>
        <span class="ab">${esc(a.title)} · <b>${esc(a.ability_name)}</b>: <span class="${state === "sulking" ? "sulk" : ""}">${state}</span></span>
        ${line}</button>`;
    }).join("");
  }
  $("council").addEventListener("click", (e) => {
    const b = e.target.closest(".adv"); if (!b) return;
    const a = E.ADVISORS[b.dataset.aid];
    const stats = ["experience", "decisions", "strategy", "administration", "persuasion", "logic"];
    openVeil(`<div class="dialog" role="dialog" aria-label="${esc(a.name)}"><img class="fullcard" src="img/advisor-${b.dataset.aid}.webp" alt="${esc(a.name)}, ${esc(a.title)}">
      <p class="sum" style="margin:0">${stats.map((k) => `${k} ${a[k]}`).join(" · ")} (DRAFT, 1–5)</p>
      <div class="row"><button class="btn" type="button" data-close>Close</button></div></div>`);
    $("veil").querySelector("[data-close]").onclick = closeVeil;
  });
  function windView() {
    const w = E.WINDS[s.wind];
    const [n] = E.sailing(s, true), [so] = E.sailing(s, false);
    $("wind").innerHTML = `<p class="eyebrow">Wind and current</p><img src="img/wind-${s.wind}.webp" alt="${esc(w.latin)}, ${esc(w.from === "none" ? "dead calm" : "from the " + w.from)}">
      <p>Current ${E.CURRENT_TEXT[s.current]}. Convoys north ${E.pct(n)}, south ${E.pct(so)}.</p>`;
  }
  function cityView() {
    const cells = (zone) => {
      const list = s.buildings.filter((b) => E.BLD[b.kind].zone === zone)
        .sort((a, b) => (a.done > s.turn) - (b.done > s.turn) || E.BLD_IDS.indexOf(a.kind) - E.BLD_IDS.indexOf(b.kind));
      const out = list.map((b) => b.done > s.turn
        ? `<span class="plot wip" title="${esc(E.BLD[b.kind].name)}, ready in turn ${b.done}">${esc(E.BLD[b.kind].short)} · ${b.done - s.turn}</span>`
        : `<span class="plot" title="${esc(E.BLD[b.kind].name)}">${esc(E.BLD[b.kind].short)}</span>`);
      while (out.length < (zone === "town" ? E.TOWN_PLOTS : E.FIELD_PLOTS)) out.push(`<span class="plot empty">free</span>`);
      return out.join("");
    };
    const free = Math.max(0, Math.trunc(s.ships) - E.shipsAtSea(s));
    const sea = s.convoys.map((c) => `a convoy back in turn ${c.arrive}`).concat(s.shipyard.map((t) => `a ship on the slipway, ready in turn ${t}`));
    $("city").innerHTML = `<p class="eyebrow">Acruvium</p>
      <div><div class="zone-h"><span>Inside the walls</span><span>${E.plotsUsed(s, "town")}/${E.TOWN_PLOTS}</span></div><div class="plots">${cells("town")}</div></div>
      <div><div class="zone-h"><span>Fields round the bay</span><span>${E.plotsUsed(s, "field")}/${E.FIELD_PLOTS}</span></div><div class="plots">${cells("field")}</div></div>
      <p class="fleet">Houses for ${E.intc(E.housing(s))} people. ${Math.trunc(s.ships)} ships, ${free} in harbour, berths for ${E.berths(s)}.${sea.length ? " At sea: " + sea.join("; ") + "." : ""}${s.tribute_debt ? ` Owed to Rome: ${E.intc(s.tribute_debt)} denarii.` : ""}</p>`;
  }
  function refresh(before) { ledger(before); councilView(); windView(); cityView(); }

  // ---------- the overlay ----------
  function openVeil(html) { const v = $("veil"); v.innerHTML = html; v.hidden = false; const f = v.querySelector("button, input"); if (f) f.focus(); }
  function closeVeil() { $("veil").hidden = true; $("veil").innerHTML = ""; }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const options = (opts) => opts.map((o, i) => `<button class="opt${o.roll ? " die" : ""}" type="button" data-i="${i}"><span class="key">${"ABCDEFG"[i]}</span><span class="what">${esc(o.label)}</span><span class="sub">${esc(o.sub || "")}</span></button>`).join("");
  function waitPick(root) { return new Promise((res) => root.querySelectorAll("[data-i]").forEach((b) => (b.onclick = () => res(+b.dataset.i)))); }

  const DECK_ICON = {
    land: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 22V6"/><path d="M12 9c-3-1-4-4-4-6 3 1 4 3 4 6zM12 9c3-1 4-4 4-6-3 1-4 3-4 6zM12 14c-3-1-4-4-4-6 3 1 4 3 4 6zM12 14c3-1 4-4 4-6-3 1-4 3-4 6z"/></svg>',
    sea: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 9c3-3 5 3 8 0s5 3 8 0 3-1 4 0M2 14c3-3 5 3 8 0s5 3 8 0 3-1 4 0M2 19c3-3 5 3 8 0s5 3 8 0 3-1 4 0"/></svg>',
    omen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M12 2v2M5 4l1.5 1.5M19 4l-1.5 1.5"/></svg>',
  };
  function cardHTML(c, i) {
    const eff = c.choice ? `<div class="eff decide">Your decision</div>` : `<div class="eff">${esc(E.effectsText(c.effects))}</div>`;
    const who = c.advisor && E.ADVISORS[c.advisor] ? ` · ${E.ADVISORS[c.advisor].name}` : "";
    const hint = c.choice ? String(c.choice.prompt).replace(/\s+/g, " ") : c.scribe_hint || "";
    return `<div class="card${c.quiet ? " quiet" : ""}" data-deck="${c.deck}" id="card-${i}">
      <div class="back"><span>ACRVVIVM</span></div>
      <div class="face"><div class="band"><span>${E.DECK_LABEL[c.deck]}${esc(who)}</span>${DECK_ICON[c.deck]}</div>
      <div class="body"><span class="title">${esc(c.title)}</span><span class="hint">${esc(hint)}</span></div>${eff}</div></div>`;
  }

  let seasonCards = [];
  const ui = {
    async reveal(cards) {
      seasonCards = cards;
      $("cards").innerHTML = cards.map(cardHTML).join("");
      await sleep(350);
      cards.forEach((_, i) => $("card-" + i).classList.add("flip"));
      await sleep(window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 50 : 1000);
    },
    async cardChoice(c, opts) {
      const i = seasonCards.indexOf(c);
      document.querySelectorAll(".card").forEach((el) => el.classList.remove("active"));
      if (i >= 0) $("card-" + i).classList.add("active");
      const box = $("decide");
      box.innerHTML = `<p class="eyebrow">${E.DECK_LABEL[c.deck]} · your decision</p><h2>${esc(c.title)}</h2>
        <p class="voice" style="margin:0">${esc(String(c.choice.prompt).replace(/\s+/g, " "))}</p><div class="choice">${options(opts)}</div>`;
      box.hidden = false;
      const pick = await waitPick(box);
      box.hidden = true;
      if (i >= 0) $("card-" + i).classList.remove("active");
      return pick;
    },
    async roll(r) {
      const faces = D.dice[stone];
      openVeil(`<div class="dialog die-stage spin" role="dialog" aria-label="Dice roll"><p class="eyebrow" style="margin:0">${esc(r.why)}</p>
        <div class="die" id="die">${faces[19]}</div><div class="verdict" id="verdict" aria-live="polite"></div><div class="sum" id="sum">d${r.die}${r.bonus ? ` + ${r.bonus}` : ""} · need ${r.target}</div>
        <div class="row" style="justify-content:center"><button class="btn" type="button" id="dieok" hidden>Continue</button></div></div>`);
      const stage = $("veil").firstElementChild;
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      for (let k = 0; k < (reduce ? 1 : 12); k++) { $("die").innerHTML = faces[Math.floor(Math.random() * 20)]; await sleep(55 + k * 9); }
      stage.classList.remove("spin");
      $("die").innerHTML = faces[r.r - 1];
      $("verdict").textContent = r.tag;
      $("verdict").classList.toggle("bad", !r.ok);
      $("sum").textContent = `rolled ${r.r}${r.bonus ? ` ${r.bonus >= 0 ? "+" : "−"} ${Math.abs(r.bonus)} = ${r.total}` : ""} · needed ${r.target}`;
      const ok = $("dieok"); ok.hidden = false; ok.focus();
      await new Promise((res) => (ok.onclick = res));
      closeVeil();
    },
    async ability(aid, question) {
      const a = E.ADVISORS[aid];
      openVeil(`<div class="dialog" role="dialog" aria-label="${esc(a.name)}"><div class="head">${coin(aid)}<div><div class="ability">${esc(a.ability_name)}</div>
        <div class="uses">${esc(a.name)} · ${a.ability_uses === "game" ? "once per governorship" : "once a year"}</div></div></div>
        <p class="voice" style="margin:0">“${esc(question)}”</p>
        <div class="row"><button class="btn" type="button" data-i="1">Yes, do it</button><button class="btn quiet" type="button" data-i="0">No</button></div></div>`);
      const yes = await waitPick($("veil"));
      closeVeil();
      return yes === 1;
    },
    async choose(title, text, opts) {
      openVeil(`<div class="dialog" role="dialog" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${text ? `<p class="voice">${esc(text)}</p>` : ""}<div class="choice">${options(opts)}</div></div>`);
      const i = await waitPick($("veil"));
      closeVeil();
      return i;
    },
    async number(text, lo, hi) {
      openVeil(`<div class="dialog" role="dialog" aria-label="${esc(text)}"><h2>${esc(text)}</h2>
        <div class="row"><input type="number" id="numin" min="${lo}" max="${hi}" value="${hi}"> <span class="sum">${lo} to ${hi}</span></div>
        <div class="row"><button class="btn" type="button" id="numok">Agreed</button></div></div>`);
      const v = await new Promise((res) => ($("numok").onclick = () => res(Math.max(lo, Math.min(hi, parseInt($("numin").value, 10) || lo)))));
      closeVeil();
      return v;
    },
  };
  E.setUI(ui);

  // ---------- the season ----------
  function save() { store.set(KEY, JSON.stringify(s)); }

  async function startSeason() {
    E.rollWeather(s);
    say = {};
    refresh();
    const [season, year] = E.seasonOf(s.turn);
    $("stage").innerHTML = `<section class="panel"><p class="eyebrow">${season.season}, AD ${year} · the season's cards</p>
      <h2>Three cards are turned over</h2><div class="cards" id="cards"></div></section>
      <section class="panel" id="decide" hidden></section><section class="panel" id="orders" hidden></section>`;
    if (s.cards_turn !== s.turn) {
      s.before = Object.fromEntries(E.NUMBERS.map((n) => [n, s[n]]));
      const notes = [];
      const cards = await E.revealCards(s, notes);
      s.season_cards = cards.map((c) => c.id);
      s.season_notes = notes;
      s.cards_turn = s.turn;
      save();
    } else {
      const cards = s.season_cards.map((id) => D.cards.find((c) => c.id === id)).filter(Boolean);
      $("cards").innerHTML = cards.map(cardHTML).join("");
      cards.forEach((_, i) => $("card-" + i).classList.add("flip"));
    }
    ordersPhase();
  }

  function ordersPhase() {
    ({ wants, say } = E.council(s));
    refresh(s.before);
    const [bold, prudent] = E.suggest(s);
    const box = $("orders");
    box.hidden = false;
    const opts = [];
    if (bold.length) opts.push({ label: "Bold: " + bold.map((o) => E.describe(s, o)).join("; "), sub: E.preview(s, bold), orders: bold });
    if (prudent.length) opts.push({ label: "Prudent: " + prudent.map((o) => E.describe(s, o)).join("; "), sub: E.preview(s, prudent), orders: prudent });
    box.innerHTML = `<p class="eyebrow">The scribe</p><h2>What are your orders?</h2>
      <p class="voice" style="margin:0">“${esc(E.situation(s))} What are your orders?”</p>
      ${opts.length ? "" : `<p class="sum" style="margin:0">The scribe has no plan to offer: the stores lack the goods or coin for any building. Watch the goods; every 50 soldiers use one a season.</p>`}
      <div class="choice">${options(opts)}
        <button class="opt" type="button" id="own"><span class="key">${"ABC"[opts.length]}</span><span class="what">Give your own orders, in your own words</span><span class="sub">e.g. “build a fishery and send a convoy south to sell wine”</span></button>
        <button class="opt" type="button" id="pick"><span class="key">${"ABCD"[opts.length + 1]}</span><span class="what">Choose decrees from the list</span><span class="sub">up to three this season</span></button>
      </div><div class="row"><button class="btn quiet" type="button" id="idle">Do nothing this season</button></div><div id="work"></div>`;
    box.querySelectorAll("[data-i]").forEach((b) => (b.onclick = () => seal(opts[+b.dataset.i].orders)));
    $("idle").onclick = () => seal([]);
    $("own").onclick = ownWords;
    $("pick").onclick = pickDecrees;
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function confirmOrders(accepted, problems, reply) {
    const work = $("work");
    work.innerHTML = `${reply ? `<p class="voice">The scribe: “${esc(reply)}”</p>` : ""}
      ${problems.length ? `<ul class="problems">${problems.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
      ${accepted.length ? `<p class="eyebrow" style="margin-top:12px">I will write these decrees</p><ol>${accepted.map((o) => `<li>${esc(E.describe(s, o))}</li>`).join("")}</ol>
      <p class="sum">${esc(E.preview(s, accepted))}</p><div class="row"><button class="btn" type="button" id="sealit">Seal them</button></div>` : ""}`;
    if (accepted.length) $("sealit").onclick = () => seal(accepted);
  }

  function ownWords() {
    $("work").innerHTML = `<div style="display:grid;gap:10px;margin-top:12px"><label for="words" class="eyebrow" style="margin:0">Your orders, Governor</label>
      <textarea id="words" placeholder="Build wheat terraces and send a convoy north to buy 2 months of grain"></textarea>
      <div class="row"><button class="btn" type="button" id="read">Give them to the scribe</button></div><div id="answer"></div></div>`;
    $("words").focus();
    $("read").onclick = () => {
      const text = $("words").value.trim(); if (!text) return;
      const res = E.wordParse(text);
      const [accepted, problems] = E.validate(s, res.orders);
      const keep = $("words").value;
      confirmOrders(accepted, problems, res.reply);
      const again = document.createElement("div");
      again.className = "row"; again.style.marginTop = "8px";
      again.innerHTML = `<button class="btn quiet" type="button">Write different orders</button>`;
      again.firstChild.onclick = () => { ownWords(); $("words").value = keep; };
      $("work").appendChild(again);
    };
  }

  function pickDecrees() {
    const work = $("work");
    const builds = E.BUILDING_LIST.filter((b) => b.id !== "forum");
    work.innerHTML = `<p class="eyebrow" style="margin-top:12px">Decrees · choose up to three</p><div class="decrees">${E.DECREES.map((d, i) => {
      const cost = E.num(d.cost_treasury), goods = E.num(d.cost_goods);
      let extra = "";
      if (d.id === "build") extra = `<select id="bld" aria-label="What to build">${builds.map((b) => `<option value="${b.id}">${esc(b.name)} (${b.zone === "town" ? "town" : "field"}) · ${E.intc(E.num(b.cost_treasury))} den${E.num(b.cost_goods) ? `, ${E.num(b.cost_goods)} goods` : ""}, ${E.num(b.seasons_to_build)} seasons</option>`).join("")}</select>`;
      if (d.id === "send_convoy") extra = `<select id="cdir" aria-label="Direction"><option value="north">north up the coast</option><option value="south">south</option></select>
        <select id="ccargo" aria-label="Cargo"><option value="buy_grain">buy grain</option><option value="sell_wine_oil">sell wine &amp; oil</option><option value="sell_goods">sell goods</option></select>
        <input type="number" id="camt" min="0" max="99" value="0" aria-label="Amount, 0 = as much as sensible" title="Amount (0 = ask me)">`;
      return `<label class="decree" for="dc${i}"><input type="checkbox" id="dc${i}" data-id="${d.id}"><span>${esc(d.name)}</span><span class="cost">${cost ? E.intc(cost) + " den" : "free"}${goods ? `, ${goods} goods` : ""}</span><span class="extra">${extra}</span></label>`;
    }).join("")}</div><div class="row" style="margin-top:10px"><button class="btn" type="button" id="check">Check the orders</button></div><div id="answer"></div>`;
    work.querySelectorAll("input[type=checkbox]").forEach((cb) => (cb.onchange = () => {
      cb.closest(".decree").classList.toggle("on", cb.checked);
      if (work.querySelectorAll("input[type=checkbox]:checked").length > 3) { cb.checked = false; cb.closest(".decree").classList.remove("on"); }
    }));
    $("check").onclick = () => {
      const picked = [...work.querySelectorAll("input[type=checkbox]:checked")].map((cb) => {
        const id = cb.dataset.id;
        if (id === "build") return E.order("build", "none", "none", 0, $("bld").value);
        if (id === "send_convoy") return E.order("send_convoy", $("cdir").value, $("ccargo").value, parseInt($("camt").value, 10) || 0);
        return E.order(id);
      });
      if (!picked.length) return;
      const [accepted, problems] = E.validate(s, picked);
      const div = $("answer");
      div.innerHTML = `${problems.length ? `<ul class="problems">${problems.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
        ${accepted.length === picked.length ? `<p class="sum">${esc(E.preview(s, accepted))}</p><div class="row"><button class="btn" type="button" id="sealit">Seal them</button></div>` : ""}`;
      if (accepted.length === picked.length) $("sealit").onclick = () => seal(accepted);
    };
  }

  async function seal(orders) {
    $("orders").querySelectorAll("button").forEach((b) => (b.disabled = true));
    const before = s.before;
    const notes = [...(s.season_notes || [])];
    E.updateMoods(s, wants, orders, notes);
    await E.applyDecrees(s, orders, notes);
    await E.resolve(s, notes);
    E.clampAndCheck(s, notes);
    say = {};
    refresh(before);
    const [season, year] = E.seasonOf(s.turn);
    const rows = E.NUMBERS.filter((n) => Math.abs(s[n] - before[n]) >= 0.05).map((n) => {
      const d = s[n] - before[n];
      return `<tr><td>${esc(E.RULES[n].name)}</td><td>${E.fmt(n, before[n])}</td><td>${E.fmt(n, s[n])}</td><td class="${d > 0 ? "up" : "down"}">${d > 0 ? "+" : "−"}${E.fmt(n, Math.abs(d))}</td></tr>`;
    }).join("");
    const history = seasonCardsHistory();
    const list = notes.map((t) => `<li>${esc(t)}</li>`).join("") + history.map((t) => `<li class="history">${esc(t)}</li>`).join("");
    const done = s.over;
    s.turn += 1;
    if (done) store.del(KEY); else save();
    $("stage").innerHTML = `<section class="panel"><p class="eyebrow">${season.season}, AD ${year} · the season ends</p>
      <h2>${done ? "The end of your governorship" : "The scribe's report"}</h2>${done ? `<p class="voice">${esc(done)} You governed for ${s.turn - 1} seasons.</p>` : ""}
      <ul class="notes">${list || "<li>A quiet season.</li>"}</ul>
      ${rows ? `<div style="overflow-x:auto;margin-top:14px"><table class="changes"><tbody>${rows}</tbody></table></div>` : ""}
      <div class="row" style="margin-top:16px"><button class="btn" type="button" id="next">${done ? "Govern again" : "Next season"}</button></div></section>`;
    $("next").onclick = () => { if (done) { s = E.newGame(); intro(); } else startSeason(); };
    $("next").focus({ preventScroll: true });
    $("stage").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function seasonCardsHistory() {
    return (s.season_cards || []).map((id) => D.cards.find((c) => c.id === id)).filter((c) => c && String(c.historical_note || "").trim())
      .map((c) => `History (${c.title}): ${String(c.historical_note).replace(/\s+/g, " ")}`);
  }

  function intro() {
    say = {};
    refresh();
    $("stage").innerHTML = `<section class="panel"><p class="eyebrow">AD 30 · Acruvium, in the Bay of Kotor</p><h2>Tiberius sends you to govern Acruvium</h2>
      <p class="voice">Each turn is one season. Keep Rome and the people content and the granaries full. Each season three cards are turned over, one from the land, one from the sea and one from the gods; then your council speaks and you give up to three orders.</p>
      <p class="sum">You lose if Roman favour reaches 0, if the town rises while the garrison is under 100 men, or after two hungry seasons in a row. The tribute of ${E.intc(E.TRIBUTE)} denarii falls due each summer.</p>
      <div class="row"><button class="btn" type="button" id="begin">Take up the governorship</button></div></section>`;
    $("begin").onclick = startSeason;
  }

  // ---------- die stone picker, new game, boot ----------
  function stones() {
    $("stones").innerHTML = "Die: " + Object.keys(D.dice).map((k) => `<button type="button" data-stone="${k}" aria-pressed="${k === stone}">${k}</button>`).join("");
    $("stones").querySelectorAll("button").forEach((b) => (b.onclick = () => { stone = b.dataset.stone; store.set(STONE_KEY, stone); stones(); }));
  }
  $("newgame").onclick = () => { store.del(KEY); s = E.newGame(); closeVeil(); intro(); };
  stones();
  let saved = null;
  try { saved = JSON.parse(store.get(KEY) || "null"); } catch (e) { saved = null; }
  if (saved && saved.turn && !saved.over) { s = saved; startSeason(); } else { s = E.newGame(); intro(); }
})();
</script>
